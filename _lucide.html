<style>
        /* ===== Aikoni za mstari (Lucide) — zinachukua nafasi ya Font Awesome pale zinapopatikana ===== */
        i.kj-lu { font-family: 'lucide' !important; font-weight: normal !important; font-style: normal !important; }
        i.kj-lu::before { content: var(--kj-g) !important; font-family: 'lucide' !important; font-weight: normal !important; }

/* ===== Vitufe vya like / comment / share / save: aikoni + idadi tu ===== */
.kj-n { font-variant-numeric: tabular-nums; font-weight: 700; }
.post-buttons button .kj-n { font-size: 21px; line-height: 1; font-weight: 600; }
.post-buttons button:not(.liked) { color: #50555c !important; }
.post-buttons button i { font-size: 21px; line-height: 1; }
.post-buttons button { gap: 7px !important; padding: 9px 0 !important; }
</style>

  function convert(el) {

<script>
/* Idadi fupi: 1400 -> 1.4K, 3000 -> 3K, 1200000 -> 1.2M. Pia husawazisha .kj-n[data-src] kutoka kwenye span iliyofichwa ambayo JS ya zamani inaisasisha. */
(function () {
  window.kjFmt = function (n) {
    n = parseInt(n, 10) || 0;
    if (n < 1000) return String(n);
    var u, t;
    if (n >= 1e6) { u = 'M'; t = (n >= 1e7) ? Math.floor(n / 1e6) : Math.floor(n / 1e5) / 10; }
    else { u = 'K'; t = (n >= 1e5) ? Math.floor(n / 1e3) : Math.floor(n / 100) / 10; }
    return String(t).replace(/\.0$/, '') + u;
  };
  function setText(el, txt) { if (el.textContent !== txt) el.textContent = txt; }
  window.kjSyncCounts = function (root) {
    (root || document).querySelectorAll('.kj-n[data-src]').forEach(function (el) {
      var src = document.getElementById(el.getAttribute('data-src'));
      if (!src) return;
      var d = (src.textContent || '').replace(/[^0-9]/g, '');
      setText(el, window.kjFmt(d || 0));
    });
    (root || document).querySelectorAll('.kj-n[data-n]').forEach(function (el) {
      setText(el, window.kjFmt(el.getAttribute('data-n')));
    });
  };
  var pending = false;
  function later() { if (pending) return; pending = true; requestAnimationFrame(function () { pending = false; window.kjSyncCounts(); }); }
  function init() {
    window.kjSyncCounts();
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
