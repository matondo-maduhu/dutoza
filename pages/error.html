<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> | DUTOZA</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f0f2f5;color:#050505}
  .card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:34px 26px;text-align:center;
        box-shadow:0 10px 40px rgba(15,23,42,.10)}
  .code{font-size:68px;font-weight:900;line-height:1;margin:0 0 6px;
        background:linear-gradient(135deg,#1EB53A,#00A3DD);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:6px 0 8px}
  p{margin:0 0 22px;color:#65676b;font-size:15px;line-height:1.5}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a,button{font:inherit;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;border:0;cursor:pointer;text-decoration:none}
  .p{background:#1EB53A;color:#fff}
  .s{background:#e4e6eb;color:#050505}
</style>
</head>
<body>
  <div class="card">
    <div class="code"></div>
    <h1></h1>
    <p></p>
    <div class="row">
      <a class="p" href="/home">Rudi mwanzo</a>
      <button class="s" type="button" onclick="if(history.length>1){history.back()}else{location.href='/home'}">Rudi nyuma</button>
    </div>
  </div>

<!-- DUTOZA Firebase Auth (design haijaguswa) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
