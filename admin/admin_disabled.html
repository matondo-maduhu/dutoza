<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akaunti Zilizozimwa - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #f0f2f5; padding-bottom: 40px; }
.topbar { background: #1EB53A; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
.topbar a { color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; }
.container { max-width: 760px; margin: 16px auto; padding: 0 12px; }
.flash-msg { background: #e7f3ff; color: #1EB53A; padding: 10px; border-radius: 8px; margin-bottom: 14px; text-align: center; font-size: 14px; border: 1px solid #b6d4fe; }
.empty { color: #777; font-size: 14px; padding: 20px 0; text-align: center; }

h2.sec { font-size: 15px; margin: 18px 4px 8px; color: #333; }
.item-row { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.item-row strong { font-size: 15px; color: #333; }
.item-row span { display: block; font-size: 12px; color: #777; margin-top: 2px; }
.pill { display: inline-block; font-size: 11px; font-weight: bold; padding: 3px 9px; border-radius: 10px; margin-left: 6px; }
.pill.amber { background: #fff3cd; color: #8a6d00; } .pill.red { background: #fde2e2; color: #b91c1c; }
.btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btns form { display: inline; }
.btn { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: bold; cursor: pointer; color: #fff; }
.btn-g { background: #1EB53A; } .btn-r { background: #dc2626; }

</style>
</head>
<body>
<div class="topbar">
    <h1><i class="fa-solid fa-user-clock"></i> Akaunti Zilizozimwa</h1>
    <a href="#"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
</div>
<div class="container">
<div class="flash-msg"></div>

<h2 class="sec"><i class="fa-solid fa-hourglass-half" style="color:#dc2626"></i> Zinafutwa — </h2>

<div class="item-row">
  <strong>@</strong><span class="pill red">siku  zimebaki</span>
  <span> · itafutwa kabisa  · Linkup  zitafutwa pamoja naye</span>
  <div class="btns">
    <form method="POST" action="#" onsubmit="return confirm('Ghairi kufuta akaunti ya @?');"><button class="btn btn-g">Ghairi kufuta</button></form>
    <button class="btn btn-r" type="button" onclick="deleteNow(, '', this)">Futa sasa</button>
  </div>
</div>
<p class="empty">Hakuna akaunti inayofutwa.</p>

<h2 class="sec"><i class="fa-solid fa-circle-pause" style="color:#d97706"></i> Zimezimwa kwa muda — </h2>

<div class="item-row">
  <strong>@</strong><span class="pill amber">hadi  (siku )</span>
  <span> · Linkup </span>
  <div class="btns">
    <form method="POST" action="#" onsubmit="return confirm('Rudisha akaunti ya @ sasa?');"><button class="btn btn-g">Rudisha mapema</button></form>
  </div>
</div>
<p class="empty">Hakuna akaunti iliyozimwa kwa muda.</p>


<h2 class="sec"><i class="fa-solid fa-user-slash" style="color:#64748b"></i> Zilizozimwa bila muda (za zamani) — </h2>

<div class="item-row">
  <strong>@</strong>
  <span> · zinarejea zenyewe mtu akiingia</span>
  <div class="btns"><form method="POST" action="#"><button class="btn btn-g">Rudisha</button></form></div>
</div>

</div>
<script>
function deleteNow(id, username, btn) {
  var typed = prompt('Hii inafuta KABISA sasa hivi. Andika username "' + username + '" kuthibitisha:');
  if (!typed || typed.trim().toLowerCase() !== username.toLowerCase()) { if (typed !== null) alert('Username haikulingana.'); return; }
  btn.disabled = true; btn.textContent = 'Inafuta...';
  fetch('/admin/delete_user/' + id, { method: 'POST', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.success) { btn.closest('.item-row').remove(); } else { alert(d.message || 'Imeshindikana'); btn.disabled = false; btn.textContent = 'Futa sasa'; } })
    .catch(function () { alert('Imeshindikana'); btn.disabled = false; btn.textContent = 'Futa sasa'; });
}
</script>

<!-- DUTOZA Firebase Auth (design haijaguswa) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>

</body></html>
