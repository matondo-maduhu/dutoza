<!DOCTYPE html>

<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore · Kijiji</title>

<style>
:root {
  --tz-green: #00a859;
  --tz-green-dark: #006b3c;
  --tz-blue: #00a9e0;
  --tz-blue-dark: #006b8f;
  --tz-yellow: #fcd116;
  --tz-black: #101820;

  --bg: #061c16;
  --bg2: #071d2b;
  --surface: rgba(10, 38, 31, .88);
  --surface2: rgba(7, 30, 42, .9);
  --text: #f5fff9;
  --muted: #b7d4c7;
  --border: rgba(0, 168, 89, .38);

  --green-gradient: linear-gradient(135deg, #00a859, #007a45);
  --blue-gradient: linear-gradient(135deg, #00a9e0, #006b8f);
  --tz-gradient: linear-gradient(135deg, #00a859 0%, #00a9e0 48%, #fcd116 100%);

  --radius: 18px;
  --shadow: 0 12px 30px rgba(0,0,0,.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(0,168,89,.18), transparent 30%),
    radial-gradient(circle at 100% 20%, rgba(0,169,224,.16), transparent 30%),
    linear-gradient(135deg, var(--bg), var(--bg2));
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.45;
}

a {
  color: var(--tz-blue);
  text-decoration: none;
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(4, 28, 22, .88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(252,209,22,.35);
  padding:
    max(10px, env(safe-area-inset-top))
    16px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar h1 {
  font-size: 1.12rem;
  font-weight: 800;
  flex: 1;
  color: #fff;
}

.topbar h1::first-letter {
  color: var(--tz-yellow);
}

.topbar .back {
  color: #fff;
  font-size: 1.25rem;
  padding: 7px 11px;
  border-radius: 11px;
  background: rgba(0,168,89,.18);
  border: 1px solid rgba(0,168,89,.4);
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 14px 35px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  cursor: pointer;
  border-radius: 11px;
  padding: 8px 12px;
  font-weight: 750;
  font-size: .84rem;
  transition: transform .16s ease, filter .16s ease;
}

.btn:active {
  transform: scale(.96);
}

.btn-primary {
  background: var(--green-gradient);
  color: white;
  box-shadow: 0 5px 14px rgba(0,168,89,.22);
}

.btn-ghost {
  background: rgba(0,169,224,.10);
  color: #dff8ff;
  border: 1px solid rgba(0,169,224,.4);
}

.btn:hover {
  filter: brightness(1.12);
}

.btn-sm {
  padding: 6px 11px;
  font-size: .78rem;
}

.muted {
  color: var(--muted);
  font-size: .82rem;
}

/* =========================================================
   SECTION TITLE
========================================================= */

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #8ee8c1;
  margin: 22px 2px 10px;
  font-weight: 850;
}

.section-title::before {
  content: "";
  width: 4px;
  height: 18px;
  border-radius: 10px;
  background: var(--tz-gradient);
}

/* =========================================================
   HASHTAGS
========================================================= */

.tag-box {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  background:
    linear-gradient(135deg, rgba(0,168,89,.14), rgba(0,169,224,.10));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  position: relative;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 7px 8px 7px 11px;
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.12);
  color: #effff7;
  font-size: .84rem;
  font-weight: 700;
  transition: .18s ease;
}

.tag:hover {
  background: rgba(0,168,89,.18);
  border-color: rgba(252,209,22,.65);
  transform: translateY(-1px);
  text-decoration: none;
}

.tag-hash {
  color: var(--tz-yellow);
  font-weight: 900;
}

.tag-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tag-count {
  min-width: 23px;
  text-align: center;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(252,209,22,.15);
  color: #ffe879;
  font-size: .68rem;
}

.tag-hot {
  background: linear-gradient(
    135deg,
    rgba(0,168,89,.28),
    rgba(0,169,224,.16)
  );
  border-color: rgba(252,209,22,.55);
}

.tag-hot .tag-count {
  background: var(--tz-yellow);
  color: #15200b;
}

.tag-hidden {
  display: none;
}

.hashtag-tools {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-bottom: 5px;
}

.hashtag-search {
  flex: 1;
  min-width: 0;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(0,168,89,.35);
  color: white;
  border-radius: 11px;
  padding: 9px 11px;
  outline: none;
}

.hashtag-search:focus {
  border-color: var(--tz-yellow);
  box-shadow: 0 0 0 3px rgba(252,209,22,.08);
}

.hashtag-search::placeholder {
  color: #91afa4;
}

.hashtag-toggle {
  border: 1px solid rgba(0,169,224,.4);
  background: rgba(0,169,224,.12);
  color: #dff8ff;
  border-radius: 11px;
  padding: 8px 11px;
  cursor: pointer;
  font-weight: 750;
  white-space: nowrap;
}

/* =========================================================
   TIME FILTER
========================================================= */

.popular-controls {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 3px 2px 11px;
  scrollbar-width: none;
}

.popular-controls::-webkit-scrollbar {
  display: none;
}

.time-btn {
  flex: 0 0 auto;
  border: 1px solid rgba(0,168,89,.34);
  background: rgba(255,255,255,.045);
  color: #d9f8eb;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: .77rem;
  font-weight: 750;
  transition: .18s ease;
}

.time-btn:hover {
  border-color: var(--tz-yellow);
}

.time-btn.active {
  background: var(--green-gradient);
  border-color: #50e6a2;
  color: white;
  box-shadow: 0 5px 16px rgba(0,168,89,.22);
}

.custom-days {
  display: none;
  gap: 7px;
  margin: 0 0 10px;
}

.custom-days.show {
  display: flex;
}

.custom-days input {
  flex: 1;
  min-width: 0;
  background: rgba(0,0,0,.24);
  color: white;
  border: 1px solid rgba(0,168,89,.4);
  border-radius: 10px;
  padding: 8px 10px;
  outline: none;
}

.custom-days button {
  border: 0;
  border-radius: 10px;
  background: var(--green-gradient);
  color: white;
  padding: 8px 13px;
  font-weight: 800;
  cursor: pointer;
}

.period-label {
  font-size: .74rem;
  color: #9fc8b8;
  margin: -2px 2px 9px;
}

/* =========================================================
   HORIZONTAL SCROLL
========================================================= */

.scroll-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 3px 2px 13px;
  scrollbar-width: thin;
  scrollbar-color: var(--tz-green) transparent;
  scroll-snap-type: x proximity;
}

.scroll-row::-webkit-scrollbar {
  height: 5px;
}

.scroll-row::-webkit-scrollbar-thumb {
  background: linear-gradient(
    90deg,
    var(--tz-green),
    var(--tz-blue)
  );
  border-radius: 10px;
}

.scroll-row > * {
  scroll-snap-align: start;
}

/* =========================================================
   USER CARDS
========================================================= */

.user-card {
  flex: 0 0 104px;
  background:
    linear-gradient(145deg, rgba(0,168,89,.24), rgba(0,55,42,.82));
  border: 1px solid rgba(0,168,89,.52);
  border-radius: var(--radius);
  padding: 8px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: var(--shadow);
  transition: transform .18s ease, border-color .18s ease;
}

.user-card:hover {
  transform: translateY(-3px);
  border-color: var(--tz-yellow);
}

.user-card .avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  background: #064e3b;
  margin-bottom: 5px;
  border: 2px solid #43e59b;
}

.user-card .username {
  font-size: .78rem;
  font-weight: 800;
  color: #c5f9df;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.user-card .followers {
  font-size: .66rem;
  color: #9fc8ff;
  margin-bottom: 5px;
}

/* =========================================================
   VERIFIED BADGE
========================================================= */

.verified-badge-custom {
  width: 16px;
  height: 16px;
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}

.name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  max-width: 100%;
  min-width: 0;
}

.name-row .username {
  min-width: 0;
}

/* =========================================================
   POST CARDS
========================================================= */

.post-card {
  flex: 0 0 220px;
  min-height: 235px;
  background:
    linear-gradient(145deg, rgba(0,73,52,.86), rgba(5,35,52,.92));
  border: 1px solid rgba(0,169,224,.28);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow);
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.post-card:hover {
  transform: translateY(-3px);
  border-color: rgba(252,209,22,.6);
  box-shadow: 0 15px 35px rgba(0,0,0,.43);
}

.post-card .user-info {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
  min-width: 0;
}

.post-card .avatar-sm {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  object-fit: cover;
  background: #064e3b;
  border: 1px solid #38d996;
  flex-shrink: 0;
}

.post-card .author {
  font-size: .81rem;
  font-weight: 800;
  color: #c8f9e1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.post-card .post-text {
  font-size: .82rem;
  line-height: 1.4;
  margin-bottom: 8px;
  color: #e5f2ee;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: normal;
}

/* =========================================================
   MEDIA
========================================================= */

.video-wrapper {
  position: relative;
  width: 100%;
  height: 112px;
  border-radius: 11px;
  overflow: hidden;
  margin-bottom: 8px;
  background: #061b25;
  border: 1px solid rgba(0,169,224,.35);
  cursor: pointer;
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 42px;
  height: 42px;
  background: rgba(0,168,89,.9);
  border: 2px solid #fcd116;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 15px;
  padding-left: 3px;
  pointer-events: none;
  transition: .2s ease;
  box-shadow: 0 5px 16px rgba(0,0,0,.4);
}

.video-wrapper:hover .play-btn {
  transform: translate(-50%, -50%) scale(1.12);
}

.media-preview {
  width: 100%;
  height: 112px;
  object-fit: cover;
  border-radius: 11px;
  margin-bottom: 8px;
  background: #061b25;
  border: 1px solid rgba(0,169,224,.35);
}

.post-card .actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: .75rem;
  color: #a8e9d0;
  margin-top: auto;
  font-weight: 700;
}

.post-card .actions a {
  color: #55d5ff !important;
  font-weight: 800;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {
  .wrap {
    padding-left: 11px;
    padding-right: 11px;
  }

  .topbar {
    padding-left: 12px;
    padding-right: 12px;
  }

  .topbar h1 {
    font-size: 1rem;
  }

  .post-card {
    flex-basis: 205px;
  }

  .user-card {
    flex-basis: 100px;
  }

  .hashtag-tools {
    flex-direction: column;
  }

  .hashtag-toggle {
    width: 100%;
  }
}
</style>
</head>

<script>

/* =========================================================
   POPULAR POSTS PERIOD
========================================================= */

function changePopularPeriod(days, button) {

  if (!days || days < 1) return;

  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  if (button) {
    button.classList.add('active');
  }

  const custom = document.getElementById('customDays');

  if (custom) {
    custom.classList.remove('show');
  }

  const label = document.getElementById('periodLabel');

  if (label) {
    label.textContent =
      'Inaonyesha post maarufu za siku ' + days + ' zilizopita';
  }

  /*
   * Backend explore() inatumia ?days=
   */
  const url = new URL(window.location.href);

  url.searchParams.set('days', days);

  window.location.href = url.toString();
}


function showCustomDays() {

  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  const custom = document.getElementById('customDays');

  if (custom) {
    custom.classList.add('show');
  }

  const input = document.getElementById('customDaysInput');

  if (input) {
    input.focus();
  }
}


function applyCustomDays() {

  const input = document.getElementById('customDaysInput');

  if (!input) return;

  let days = parseInt(input.value, 10);

  if (isNaN(days)) {
    input.focus();
    return;
  }

  days = Math.max(1, Math.min(days, 3650));

  changePopularPeriod(days, null);
}


/* =========================================================
   RESTORE CURRENT PERIOD
========================================================= */

(function restorePopularPeriod() {

  const params = new URLSearchParams(window.location.search);
  const days = parseInt(params.get('days') || '7', 10);

  const label = document.getElementById('periodLabel');

  if (label) {
    label.textContent =
      'Inaonyesha post maarufu za siku ' + days + ' zilizopita';
  }

  document.querySelectorAll('.time-btn').forEach(btn => {

    const btnDays = parseInt(
      btn.getAttribute('data-days'),
      10
    );

    if (btnDays === days) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }

  });

})();


/* =========================================================
   HASHTAGS
========================================================= */

let hashtagsExpanded = false;


function toggleHashtags() {

  hashtagsExpanded = !hashtagsExpanded;

  const tags = document.querySelectorAll('.tag');
  const button = document.getElementById('hashtagToggle');

  tags.forEach((tag, index) => {

    if (index >= 5) {
      tag.classList.toggle(
        'tag-hidden',
        !hashtagsExpanded
      );
    }

  });

  if (button) {
    button.textContent =
      hashtagsExpanded
        ? 'Funga'
        : 'Ona zote';
  }

}


/* =========================================================
   HASHTAG SEARCH
========================================================= */

const hashtagSearch =
  document.getElementById('hashtagSearch');


if (hashtagSearch) {

  hashtagSearch.addEventListener('input', function () {

    const query =
      this.value.trim().toLowerCase();

    const tags =
      document.querySelectorAll('.tag');

    const button =
      document.getElementById('hashtagToggle');

    if (!query) {

      tags.forEach((tag, index) => {

        tag.classList.toggle(
          'tag-hidden',
          !hashtagsExpanded && index >= 5
        );

      });

      if (button) {
        button.style.display = '';
        button.textContent =
          hashtagsExpanded
            ? 'Funga'
            : 'Ona zote';
      }

      return;
    }

    let found = 0;

    tags.forEach(tag => {

      const name =
        tag.dataset.hashtag || '';

      const match =
        name.includes(query);

      tag.classList.toggle(
        'tag-hidden',
        !match
      );

      if (match) {
        found++;
      }

    });

    if (button) {
      button.style.display = 'none';
    }

  });

}


/* =========================================================
   VIDEO PLAYER
========================================================= */

function togglePlay(wrapper) {

  const video =
    wrapper.querySelector('video');

  const btn =
    wrapper.querySelector('.play-btn');

  if (!video) return;

  if (video.paused) {

    document.querySelectorAll('.video-wrapper video').forEach(v => {

      if (v !== video) {
        v.pause();

        const otherBtn =
          v.closest('.video-wrapper')
           ?.querySelector('.play-btn');

        if (otherBtn) {
          otherBtn.style.display = 'flex';
        }
      }

    });

    video.play()
      .then(() => {
        if (btn) {
          btn.style.display = 'none';
        }
      })
      .catch(() => {});

  } else {

    video.pause();

    if (btn) {
      btn.style.display = 'flex';
    }

  }

}


/* restore play button video ikimalizika */

document.querySelectorAll('.video-wrapper video')
  .forEach(video => {

    video.addEventListener('ended', function () {

      const btn =
        this.closest('.video-wrapper')
            ?.querySelector('.play-btn');

      if (btn) {
        btn.style.display = 'flex';
      }

    });

  });

</script>
