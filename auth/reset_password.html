<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset_password_title_dutoza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #1EB53A 0%, #00A3DD 50%, #FCD116 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }
        .box {
            background: #fff; padding: 28px 25px; border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 100%; max-width: 400px;
            text-align: center; border-top: 5px solid #1EB53A;
        }
        h1 { color: #1EB53A; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; border: 1.5px solid #ccd0d5;
            border-radius: 8px; font-size: 14px; margin-bottom: 12px;
        }
        button {
            width: 100%; background: #1EB53A; color: white; border: none;
            padding: 13px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .flash { background: #ffebee; color: #c62828; padding: 8px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h1>set_new_password</h1>
    <p>choose_password_min6</p>
    
      
        
          <div class="flash"></div>
        
      
    
    <form method="POST">
        <input type="password" name="password" placeholder="new_password" required minlength="6">
        <input type="password" name="confirm_password" placeholder="confirm_password" required minlength="6">
        <button type="submit">Badilisha Nenosiri</button>
    </form>
</div>

<!-- DUTOZA Firebase Auth (design haijaguswa) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    var form = document.querySelector('form');
    if (!form) return;
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      var emailEl = form.querySelector('input[type="email"], input[name="email"]');
      if (!emailEl) return;
      var result = await window.dutozaResetPassword(emailEl.value.trim());
      if (result.ok) {
        alert('Link ya kubadilisha nenosiri imetumwa kwenye barua pepe yako.');
      } else {
        alert(window.dutozaAuthError(result.code) || result.message);
      }
    });
  });
})();
</script>

</body>
</html>
