<style>
/* ===== REPOST FRAME (post asili ndani ya repost) - ukubwa mmoja kwa zote ===== */
.repost-frame {
    display: flex;
    flex-direction: column;
    height: 380px;
    margin: 6px 0 12px;
    padding: 14px;
    border: 1px solid #d9e2dc;
    border-radius: 16px;
    background: linear-gradient(180deg, #fbfdfb 0%, #f2f7f3 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s, box-shadow .15s;
}
.repost-frame:active { transform: scale(0.99); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.repost-frame .rf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex: 0 0 auto; }
.repost-frame .rf-avatar-link {
    display: block; flex-shrink: 0; line-height: 0;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
}
.repost-frame .rf-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    object-fit: cover; background: #e4e6eb; flex-shrink: 0;
    border: 2px solid #1EB53A;
}
.repost-frame .rf-who { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.repost-frame .rf-who strong {
    font-size: 14px; color: #050505;
    display: inline-flex; align-items: center; gap: 4px;
}
.repost-frame .rf-who span { font-size: 12px; color: #65676b; }
.repost-frame .rf-text {
    flex: 0 0 auto;
    font-size: 14px; color: #1c1e21; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 10px;
}
/* Kama hakuna picha/video: maandishi yanajaza frame */
.repost-frame.rf-text-only .rf-text {
    flex: 1 1 auto; min-height: 0; margin-bottom: 0;
    font-size: 17px; line-height: 1.55;
    -webkit-line-clamp: 10;
}
.repost-frame .rf-media {
    position: relative; flex: 1 1 auto; min-height: 0;
    border-radius: 12px; overflow: hidden; background: #0d1117;
}
.repost-frame .rf-media img,
.repost-frame .rf-media video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    pointer-events: none;
}
.repost-frame .rf-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 44px; text-shadow: 0 2px 10px rgba(0,0,0,.6);
    background: rgba(0,0,0,.2);
}
.repost-frame .rf-doc {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 12px; text-align: center; word-break: break-word;
    background: #fff; border: 1px solid #e4e6eb; border-radius: 12px;
    font-size: 13px; color: #1c1e21;
}
.repost-frame .rf-doc i { font-size: 34px; color: #1EB53A; }
.repost-frame.rf-missing {
    height: auto; align-items: center; justify-content: center;
    cursor: default; color: #65676b; font-size: 13px; text-align: center; padding: 22px 16px;
}
</style>

    <script>
    (function(){
      var focusId = ;
      var parentId = 0;
      window.pdReply = function(pid, uname){
        parentId = pid || 0;
        var bar = document.getElementById('pd-replying'), inp = document.getElementById('pd-input');
        if (parentId) { bar.hidden = false; bar.querySelector('span').textContent = 'Unamjibu @' + uname; inp.placeholder = 'Jibu @' + uname + '...'; inp.focus(); }
        else { bar.hidden = true; inp.placeholder = 'Andika maoni...'; }
      };
      window.pdSend = function(e){
        e.preventDefault();
        var inp = document.getElementById('pd-input'), btn = document.getElementById('pd-send');
        var val = (inp.value || '').trim();
        if (!val) return false;
        var fd = new FormData();
        fd.append('content', val);
        if (parentId) fd.append('parent_id', parentId);
        btn.disabled = true;
        fetch('/comment/', { method: 'POST', body: fd, credentials: 'same-origin' })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (d && d.success && d.comment) { location.href = '/post/?comment=' + d.comment.id + '#comment-' + d.comment.id; }
            else { btn.disabled = false; alert((d && d.error) || 'Imeshindikana kutuma maoni'); }
          })
          .catch(function(){ btn.disabled = false; alert('Hitilafu ya mtandao'); });
        return false;
      };
      function goFocus(){
        var id = focusId;
        if (!id && location.hash.indexOf('#comment-') === 0) id = parseInt(location.hash.slice(9), 10) || 0;
        if (!id) return;
        var el = document.getElementById('comment-' + id);
        if (!el) return;
        setTimeout(function(){ el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('pd-hl'); }, 250);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', goFocus); else goFocus();
    })();
    </script>

<script>
    function muteUser(userId) {
        if (!confirm('Mute mwandishi wa post hii?')) return;
        fetch('/mute/' + userId, { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(r => r.json())
        .then(d => alert(d.message || (d.success ? 'OK' : 'Imeshindikana')))
        .catch(() => alert('Hitilafu ya mtandao'));
    }

    function togglePostMenu(postId) {
        const menu = document.getElementById('post-dropdown-' + postId);
        // Funga menus zingine kwanza
        document.querySelectorAll('.post-dropdown').forEach(d => {
            if (d !== menu) d.style.display = 'none';
        });
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    // Funga menu ukibonyeza nje
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.post-menu-container')) {
            document.querySelectorAll('.post-dropdown').forEach(d => d.style.display = 'none');
        }
    });
</script>

<script>
(function(){
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function linkify(raw){
    if (!raw) return '';
    var html = esc(raw);
    html = html.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, function(url){
      var href = url;
      if (href.toLowerCase().indexOf('http') !== 0) href = 'https://' + href;
      var trail = '', m = href.match(/([.,;:!?)]+)$/);
      if (m) { trail = m[1]; href = href.slice(0, -trail.length); }
      var display = url;
      if (trail && display.slice(-trail.length) === trail) display = display.slice(0, -trail.length);
      return '<a class="post-url-link" href="'+href+'" target="_blank" rel="noopener noreferrer">'+display+'</a>'+trail;
    });
    html = html.replace(/#([A-Za-z0-9_\u00C0-\u024F\u0400-\u04FF]{1,60})/g, function(m,t){
      return '<a class="hashtag-link" href="/hashtag/'+encodeURIComponent(t)+'">#'+t+'</a>';
    });
    html = html.replace(/(^|[\s])@([A-Za-z0-9_]{2,32})\b/g, function(m,sp,user){
      return sp + '<a class="mention-link" href="/profile/'+encodeURIComponent(user)+'">@'+user+'</a>';
    });
    return html;
  }
  document.querySelectorAll('.post-content, .rf-text').forEach(function(el){
    var raw = el.textContent || '';
    if (!raw) return;
    if (raw.indexOf('#') === -1 && raw.indexOf('http') === -1 && raw.indexOf('www.') === -1 && raw.indexOf('@') === -1) return;
    el.innerHTML = linkify(raw);
  });
})();
</script>
