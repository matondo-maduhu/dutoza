

<style>
:root { --tz-green:#1EB53A; --tz-dark:#0d6730; --page:#f4f6f8; --text:#0f172a; --muted:#64748b; }
body .navbar { display:none !important; }
.cg-page { min-height:100dvh; background:var(--page); padding-bottom:90px; }
.cg-top {
  position:sticky; top:0; z-index:40; background:linear-gradient(135deg,var(--tz-green),var(--tz-dark));
  color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 12px rgba(30,181,58,.28);
}
.cg-top a { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:22px; }
.cg-top h1 { margin:0; font-size:17px; font-weight:800; }
.cg-body { padding:16px 14px; max-width:560px; margin:0 auto; }
.cg-body .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
.card {
  background:#fff; border-radius:18px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.06);
}
label { display:block; font-size:13px; font-weight:700; color:#333; margin-bottom:6px; }
input, textarea, select {
  width:100%; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:14px;
  outline:none; margin-bottom:14px; background:#f8fafc; box-sizing:border-box; font-family:inherit;
}
input:focus, textarea:focus, select:focus { border-color:var(--tz-green); background:#fff; }
textarea { min-height:90px; resize:vertical; }
button[type="submit"] {
  width:100%; padding:14px; border:0; border-radius:12px;
  background:linear-gradient(135deg,#34d399,var(--tz-green)); color:#fff;
  font-weight:800; font-size:15px; cursor:pointer;
}

/* Profile pic picker */
.pic-row {
  display:flex; align-items:center; gap:14px; margin-bottom:16px;
}
.pic-preview {
  width:72px; height:72px; border-radius:18px; object-fit:cover; background:#e2e8f0;
  border:2px solid #e8f5e9; flex-shrink:0;
}
.pic-actions { flex:1; }
.pic-actions .hint { font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.35; }
.pic-actions label.file-btn {
  display:inline-block; padding:8px 14px; background:#f1f5f9; border-radius:10px;
  font-size:13px; font-weight:700; color:var(--text); cursor:pointer; margin:0;
}
.pic-actions input[type="file"] { display:none; }
</style>
<div class="cg-page">
  <div class="cg-top">
    <a href="#">‹</a>
    <h1>＋ Create Group</h1>
  </div>
  <div class="cg-body">
    <p class="sub">Tengeneza group — watu wataweza ku-join, kupost, like, comment na kuchati.</p>
    <div class="card">
      <form action="#" method="POST" enctype="multipart/form-data">
        <label>Profile Picture</label>
        <div class="pic-row">
          <img class="pic-preview" id="picPreview"
               src="https://ui-avatars.com/api/?name=Group&background=1EB53A&color=fff&size=144&bold=true" alt="">
          <div class="pic-actions">
            <p class="hint">upload_photo au itaundwa otomatiki kutoka jina la group.</p>
            <label class="file-btn" for="profilePic">📷 choose_photo</label>
            <input type="file" id="profilePic" name="profile_pic" accept="image/*">
          </div>
        </div>

        <label>group_name_label *</label>
        <input type="text" name="name" id="groupName" placeholder="Mf. UDSM Computer Science" required maxlength="80">

        <label>details</label>
        <textarea name="description" placeholder="Eleza group lako kwa ufupi..." maxlength="500"></textarea>

        <label>Category</label>
        <select name="category">
          <option value="university">🎓 University</option>
          <option value="gamers">🎮 Gamers</option>
          <option value="politics">🗳️ politics</option>
          <option value="agriculture">🌱 Agriculture</option>
          <option value="business">💼 business_company</option>
          <option value="general">✨ General</option>
        </select>

        <button type="submit">Unda Group</button>
      </form>
    </div>
  </div>
</div>
<script>
(function () {
  var nameInput = document.getElementById('groupName');
  var picPreview = document.getElementById('picPreview');
  var profilePic = document.getElementById('profilePic');
  var customPic = false;

  if (nameInput && picPreview) {
    nameInput.addEventListener('input', function () {
      if (customPic) return;
      var n = nameInput.value.trim() || 'Group';
      picPreview.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(n) + '&background=1EB53A&color=fff&size=144&bold=true';
    });
  }
  if (profilePic && picPreview) {
    profilePic.addEventListener('change', function () {
      var f = profilePic.files[0];
      if (!f) return;
      customPic = true;
      picPreview.src = URL.createObjectURL(f);
    });
  }
})();
</script>
