

<style>
:root { --tz-green:#1EB53A; --tz-dark:#0d6730; --page:#f4f6f8; --text:#0f172a; --muted:#64748b; }
body .navbar { display:none !important; }
.fy-page { min-height:100dvh; background:var(--page); padding-bottom:90px; }
.fy-top {
  position:sticky; top:0; z-index:40; background:linear-gradient(135deg,var(--tz-green),var(--tz-dark));
  color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 12px rgba(30,181,58,.28);
}
.fy-top a { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:22px; }
.fy-top h1 { margin:0; font-size:17px; font-weight:800; }
.fy-sec { padding:14px; }
.fy-sec h3 { margin:0 0 10px; font-size:14px; font-weight:800; color:var(--text); }
.chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.chip-row a {
  padding:8px 14px; border-radius:999px; background:#fff; font-size:12px; font-weight:700;
  text-decoration:none; color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.post-card {

}
.post-head { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
.post-head .av { width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e2e8f0; }
.post-head .av img { width:100%;height:100%;object-fit:cover; }
.post-head a { color:var(--text); text-decoration:none; font-weight:800; font-size:14px; }
.post-head .sub { font-size:12px; color:var(--muted); }
.post-body { font-size:14px; line-height:1.5; color:#1e293b; white-space:pre-wrap; }
.post-media { margin-top:10px; border-radius:12px; overflow:hidden; background:#0f172a; }
.post-media img, .post-media video { width:100%; max-height:320px; object-fit:contain; display:block; }
.badge {
  margin-left:auto; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  background:rgba(30,181,58,.12); color:var(--tz-dark);
}
.g-card {

}
.g-card .ico { width:40px;height:40px;border-radius:12px;background:rgba(30,181,58,.12);display:flex;align-items:center;justify-content:center;font-size:18px; }
.empty { text-align:center; padding:40px 20px; color:var(--muted); background:#fff; border-radius:16px; }
