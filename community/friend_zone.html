

<style>
:root { --tz-green:#1EB53A; --tz-dark:#0d6730; --page:#f4f6f8; --text:#0f172a; --muted:#64748b; }
body .navbar { display:none !important; }
.fz-page { min-height:100dvh; background:var(--page); padding-bottom:90px; }
.fz-top {
  position:sticky; top:0; z-index:40; background:linear-gradient(135deg,var(--tz-green),var(--tz-dark));
  color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 12px rgba(30,181,58,.28);
}
.fz-top a { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:22px; }
.fz-top h1 { margin:0; font-size:17px; font-weight:800; }
.fz-body { padding:14px; }
.fz-body .sub { color:var(--muted); font-size:13px; margin:0 0 12px; }
form.search { display:flex; gap:8px; margin-bottom:16px; }
form.search input {
  flex:1; padding:12px 14px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:15px;
  outline:none; background:#fff; box-sizing:border-box;
}
form.search input:focus { border-color:var(--tz-green); }
form.search button {
  padding:12px 16px; border:0; border-radius:12px; background:var(--tz-green); color:#fff;
  font-weight:700; cursor:pointer;
}
.user-card {
  background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px;
  display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.user-card img {
  width:48px; height:48px; border-radius:50%; object-fit:cover; background:#e2e8f0; flex-shrink:0;
}
.user-card .info { flex:1; min-width:0; }
.user-card .info strong { display:block; font-size:14.5px; color:var(--text); }
.user-card .info span {
  display:block; font-size:12.5px; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.user-card .btn {
  background:var(--tz-green); color:#fff !important; padding:8px 14px; border-radius:10px;
  font-size:13px; font-weight:700; text-decoration:none; flex-shrink:0;
}
.sec-title { font-size:14px; font-weight:800; margin:8px 0 10px; color:var(--text); }
.empty {
  text-align:center; padding:36px 20px; color:var(--muted); background:#fff; border-radius:14px;
}
</style>
<div class="fz-page">
  <div class="fz-top">
    <a href="#">‹</a>
    <h1>👥 Friend Zone</h1>
  </div>
  <div class="fz-body">
    <p class="sub">search watu waliopo kwenye DUTOZA.</p>
    <form class="search" action="#" method="GET">
      <input name="q" type="search" value="" placeholder="🔎 Username au jina..." autofocus>
      <button type="submit">Search</button>
    </form>

    
      <div class="sec-title">Matokeo ya ""</div>
      
        
        <div class="user-card">
          
            <img src="" alt="">
          
            <img src="#" alt=""
                 onerror="this.src='https://ui-avatars.com/api/?name=&background=1EB53A&color=fff&size=96'">
          
            <img src="https://ui-avatars.com/api/?name=&background=1EB53A&color=fff&size=96" alt="">
          
          <div class="info">
            <strong>@ ✓</strong>
            <span></span>
          </div>
          <a href="#" class="btn">view_profile</a>
        </div>
        
      
        <div class="empty">Hakuna matokeo ya ""</div>
      
    
      <div class="sec-title">✨ Watumiaji wapya / verified</div>
      
        
        <div class="user-card">
          
            <img src="" alt="">
          
            <img src="#" alt=""
                 onerror="this.src='https://ui-avatars.com/api/?name=&background=1EB53A&color=fff&size=96'">
          
            <img src="https://ui-avatars.com/api/?name=&background=1EB53A&color=fff&size=96" alt="">
          
          <div class="info">
            <strong>@ ✓</strong>
            <span></span>
          </div>
          <a href="#" class="btn">view_profile</a>
        </div>
        
      
        <div class="empty">search_user_hint</div>
      
    
  </div>
</div>
