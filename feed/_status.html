    /* ===== Fonts za status ===== */
    .stf-f1 { font-family: -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    .stf-f2 { font-family: 'Poppins',-apple-system,'Segoe UI',sans-serif; font-weight: 800; }
    .stf-f3 { font-family: 'Pacifico','Brush Script MT',cursive; font-weight: 400; line-height: 1.5 !important; --m: .92; }
    .stf-f4 { font-family: 'Playfair Display',Georgia,'Times New Roman',serif; font-weight: 700; font-style: italic; }
    .stf-f5 { font-family: 'Baloo 2','Comic Sans MS','Chalkboard SE',cursive,sans-serif; font-weight: 800; }
    .stf-f6 { font-family: 'Bebas Neue',Impact,'Arial Narrow',sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 1.5px; --m: 1.3; }

    /* ===== Create modal ===== */
    .status-modal-box { max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    /* Provider ya muziki: iTunes / 🇹🇿 Jamendo (rangi za bendera ya Tanzania) */
    .st-prov { display: flex; gap: 8px; margin-bottom: 8px; }
    .st-prov-btn { flex: 1; border: 2px solid #e3e8ec; background: #f7f9fa; color: #1c1e21; border-radius: 20px; padding: 9px 10px;
        font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .st-prov-btn.on { border-color: #1EB53A; background: #e8f8ec; color: #0d7a28; }
    .st-prov-btn.jam { border-color: #FCD116; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55); opacity: .72;
        background: linear-gradient(135deg, #1EB53A 0%, #1EB53A 36%, #FCD116 36%, #FCD116 44%, #000 44%, #000 56%, #FCD116 56%, #FCD116 64%, #00A3DD 64%, #00A3DD 100%); }
    .st-prov-btn.jam.on { opacity: 1; border-color: #000; box-shadow: 0 0 0 2px #FCD116; }
    .st-compose { border-radius: 12px; margin-bottom: 10px; transition: background .2s; }
    .st-compose textarea { margin-bottom: 0; }
    .st-compose.stbg { padding: 18px 14px; min-height: 190px; display: flex; align-items: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
    .st-compose.stbg textarea {
        background: transparent; border: none; outline: none; color: #fff; text-align: center;
        font-size: calc(22px * var(--m, 1)); line-height: 1.3; min-height: 150px;
        text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .st-compose.stbg textarea::placeholder { color: rgba(255,255,255,.8); }
    .st-compose:not(.stbg) textarea { font-size: calc(15px * var(--m, 1)); }

    .st-editbtn { display: none; align-items: center; gap: 6px; margin-top: 8px; border: none; border-radius: 20px; padding: 8px 15px;
        background: linear-gradient(90deg,#00A3DD,#1EB53A); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    .st-label { font-size: 12px; font-weight: 700; color: #65676b; margin: 10px 0 6px; display: flex; align-items: center; gap: 6px; }
    .st-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .st-row::-webkit-scrollbar { display: none; }
    .st-sw { position: relative; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #fff;
        box-shadow: 0 0 0 1px #d0d5da; cursor: pointer; padding: 0; background-color: #fff; color: #65676b; font-size: 14px; }
    .st-sw.on { box-shadow: 0 0 0 2.5px #1EB53A; transform: scale(1.06); }
    .st-sw.on::after { content: "\2713"; position: absolute; right: -4px; top: -6px; width: 18px; height: 18px; border-radius: 50%;
        background: #1EB53A; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
    .st-font { flex: 0 0 auto; min-width: 56px; padding: 7px 12px; border-radius: 20px; border: 1.5px solid #e1e8ed; background: #f8f9fa;
        cursor: pointer; font-size: 17px; color: #1c1e21; line-height: 1.1; }
    .st-font.on { border-color: #1EB53A; background: #e8f8ec; color: #0d7a28; }

    .st-musicbtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px dashed #1EB53A; background: #f3fbf5; color: #0d7a28;
        padding: 9px 14px; border-radius: 22px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .st-chip { display: none; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; background: #e8f8ec; border-radius: 14px; }
    .st-chip.show { display: flex; }
    .st-chip img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: #cfe9d6; }
    .st-chip .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .st-chip .t small { display: block; font-weight: 500; color: #65676b; }
    .st-chip button { border: none; background: none; color: #65676b; font-size: 16px; cursor: pointer; padding: 6px; }
    .st-music { display: none; margin-top: 8px; border: 1px solid #e3e8ec; border-radius: 14px; background: #fff; padding: 10px; }
    .st-music.show { display: block; }
    .st-music input[type=search] { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1.5px solid #e3e8ec; border-radius: 20px;
        font-size: 16px; font-family: inherit; outline: none; }
    .st-music input[type=search]:focus { border-color: #1EB53A; }
    .st-mres { max-height: 230px; overflow-y: auto; margin-top: 8px; }
    .st-mrow { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #f0f2f5; }
    .st-mrow:last-child { border-bottom: none; }
    .st-mrow img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #e8f8ec; }
    .st-mrow .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .st-mrow .t small { display: block; font-weight: 500; color: #65676b; }
    .st-mrow .pv, .st-mrow .pick { border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; flex-shrink: 0; }
    .st-mrow .pv { background: #f0f2f5; color: #1c1e21; }
    .st-mrow .pick { background: #1EB53A; color: #fff; }
    .st-mmsg { padding: 12px 4px; font-size: 13px; color: #8a8d91; text-align: center; }

    /* ===== Viewer: text na mandhari + kadi ya wimbo ===== */
    .status-viewer-text-only.stbg {
        width: 100%; height: 100%; max-width: none; padding: 28px 24px; box-sizing: border-box;
        display: flex; align-items: center; justify-content: center;
        color: #fff; text-align: center; white-space: pre-wrap; word-break: break-word;
        font-size: calc(clamp(24px, 6.5vw, 34px) * var(--m, 1)); line-height: 1.3;
        text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .status-viewer-text-only[class*="stf-"] { font-size: calc(clamp(24px, 6.5vw, 34px) * var(--m, 1)); }
    .status-music-chip {
        display: none; position: absolute; z-index: 30; left: 12px; max-width: 70%;
        top: calc(env(safe-area-inset-top, 0px) + 72px);
        align-items: center; gap: 8px; padding: 5px 12px 5px 5px;
        background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border-radius: 22px; color: #fff; pointer-events: none;
    }
    .status-music-chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; animation: stSpin 6s linear infinite; }
    .status-music-chip span { min-width: 0; line-height: 1.2; }
    .status-music-chip b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-music-chip small { display: block; font-size: 10px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes stSpin { to { transform: rotate(360deg); } }

<script>
(function () {
    if (window.stStatusInit) return;
    window.stStatusInit = true;

    var THEMES = [{"id": "s1", "name": "Maua"}, {"id": "s2", "name": "Daisy"}, {"id": "s3", "name": "Bustani"}, {"id": "s4", "name": "Mapenzi"}, {"id": "s5", "name": "Nyota"}, {"id": "s6", "name": "Anga"}, {"id": "s7", "name": "Sherehe"}, {"id": "s8", "name": "Majani"}, {"id": "s9", "name": "Vipepeo"}, {"id": "s10", "name": "Furaha"}];
    var FONTS = [
        { id: 'f1', n: 'normal' }, { id: 'f2', n: 'Pro' }, { id: 'f3', n: 'Mwandiko' },
        { id: 'f4', n: 'Elegant' }, { id: 'f5', n: 'Furaha' }, { id: 'f6', n: 'Poster' }
    ];
    var MAX_BG_CHARS = 280;
    var bg = '', font = '';
    var $ = function (id) { return document.getElementById(id); };

    // Pakia Google Fonts bila kuzuia ukurasa
    function loadFonts() {
        if ($('stFontsLink')) return;
        var l = document.createElement('link');
        l.id = 'stFontsLink'; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Pacifico&family=Playfair+Display:ital,wght@1,700&family=Baloo+2:wght@800&family=Bebas+Neue&display=swap';
        document.head.appendChild(l);
    }

    function build() {
        var pal = $('stPalette'), fr = $('stFonts');
        if (!pal || pal.children.length) return;
        var none = document.createElement('button');
        none.type = 'button'; none.className = 'st-sw on'; none.dataset.id = ''; none.title = 'without mandhari';
        none.innerHTML = '<i class="fa-solid fa-ban"></i>';
        none.onclick = function () { stPickBg(''); };
        pal.appendChild(none);
        THEMES.forEach(function (t) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'st-sw stbg-' + t.id; b.dataset.id = t.id; b.title = t.name;
            b.onclick = function () { stPickBg(t.id); };
            pal.appendChild(b);
        });
        FONTS.forEach(function (f, i) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'st-font stf-' + f.id + (i === 0 ? ' on' : ''); b.dataset.id = f.id;
            b.textContent = f.n; b.style.setProperty('--m', '1');
            b.style.textTransform = 'none'; b.style.letterSpacing = 'normal'; b.style.fontSize = '16px';
            b.onclick = function () { stPickFont(f.id === 'f1' ? '' : f.id); };
            fr.appendChild(b);
        });
    }

    function paint() {
        var c = $('stCompose');
        if (!c) return;
        c.className = 'st-compose' + (bg ? ' stbg stbg-' + bg : '') + (font ? ' stf-' + font : '');
        $('stBgStyle').value = bg;
        $('stFontStyle').value = font;
        document.querySelectorAll('#stPalette .st-sw').forEach(function (b) { b.classList.toggle('on', b.dataset.id === bg); });
        document.querySelectorAll('#stFonts .st-font').forEach(function (b) {
            b.classList.toggle('on', (b.dataset.id === 'f1' ? '' : b.dataset.id) === font);
        });
    }
    window.stPickBg = function (id) { bg = id || ''; paint(); };
    window.stPickFont = function (id) { font = id || ''; paint(); };

    // Mandhari/font ni kwa status ya maandishi tu (bila picha/video) na maandishi mafupi
    window.stSync = function () {
        var f = $('statusFile'), ta = $('statusContent');
        var hasFile = !!(f && f.files && f.files.length);
        var wrap = $('stStyleWrap');
        if (wrap) wrap.style.display = hasFile ? 'none' : '';
        var eb = $('statusEditBtn');
        if (eb) eb.style.display = (hasFile && window.MediaEditor && MediaEditor.canEdit(f.files[0])) ? 'inline-flex' : 'none';
        if (hasFile) { bg = ''; font = ''; }
        else if (ta && ta.value.length > MAX_BG_CHARS) { bg = ''; }
        paint();
    };
    // open kihariri kwa file la status
    window.stEditMedia = function () {
        var f = $('statusFile'), file = f && f.files && f.files[0];
        if (!file || !window.MediaEditor) return;
        MediaEditor.open(file, function (nf) {
            try { var dt = new DataTransfer(); dt.items.add(nf); f.files = dt.files; } catch (e) { return; }
            if (typeof previewStatusFile === 'function') previewStatusFile(f);
            stSync();
        });
    };
    window.stReset = function () {
        bg = ''; font = '';
        stMusicClear(); stPrevStop();
        var p = $('stMusicPanel'); if (p) p.classList.remove('show');
        stSync();
    };

    // ===== music =====
    var timer = null, prev = new Audio(), prevBtn = null;
    function stPrevStop() {
        prev.pause();
        if (prevBtn) prevBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        prevBtn = null;
    }
    window.stPrevStop = stPrevStop;
    window.stMusicToggle = function () {
        var p = $('stMusicPanel');
        p.classList.toggle('show');
        if (p.classList.contains('show')) $('stMusicQ').focus(); else stPrevStop();
    };
    function msg(t) {
        var r = $('stMusicRes'); r.innerHTML = '';
        var d = document.createElement('div'); d.className = 'st-mmsg'; d.textContent = t; r.appendChild(d);
    }
    var prov = 'itunes';
    window.stMusicProvider = function (p) {
        if (p === prov) return;
        prov = p;
        stPrevStop();
        document.querySelectorAll('#stProv .st-prov-btn').forEach(function (b) {
            b.classList.toggle('on', b.getAttribute('data-p') === p);
        });
        var q = ($('stMusicQ').value || '').trim();
        if (q.length >= 2) { stMusicSearch(q); return; }
        if (p === 'jamendo') {
            msg('Inapakia mapendekezo…');
            fetch('/api/music/jamendo/suggestions?limit=12', { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (d) { if (prov === 'jamendo') render((d && d.items) || []); })
                .catch(function () { msg('Tatizo la mtandao. Jaribu tena.'); });
        } else {
            msg('search_song_name');
        }
    };
    window.stMusicSearch = function (q) {
        clearTimeout(timer);
        q = (q || '').trim();
        if (q.length < 2) { msg('search_song_name'); return; }
        msg('Inatafuta…');
        var cur = prov;
        var url = (cur === 'jamendo' ? '/api/music/jamendo/search?q=' : '/api/music/search?q=') + encodeURIComponent(q);
        timer = setTimeout(function () {
            fetch(url, { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (d) { if (cur === prov) render((d && d.items) || []); })
                .catch(function () { msg('Tatizo la mtandao. Jaribu tena.'); });
        }, 350);
    };
    function render(items) {
        var r = $('stMusicRes'); r.innerHTML = '';
        if (!items.length) { msg('Hakuna wimbo uliopatikana'); return; }
        items.forEach(function (it) {
            var row = document.createElement('div'); row.className = 'st-mrow';
            var img = document.createElement('img'); img.src = it.cover || ''; img.alt = '';
            var t = document.createElement('div'); t.className = 't';
            t.appendChild(document.createTextNode(it.title));
            var sm = document.createElement('small'); sm.textContent = it.artist; t.appendChild(sm);
            var pv = document.createElement('button'); pv.type = 'button'; pv.className = 'pv';
            pv.innerHTML = '<i class="fa-solid fa-play"></i>';
            pv.onclick = function () {
                if (prevBtn === pv) { stPrevStop(); return; }
                stPrevStop();
                prev.src = it.url; prev.play().catch(function () {});
                pv.innerHTML = '<i class="fa-solid fa-pause"></i>'; prevBtn = pv;
            };
            var pk = document.createElement('button'); pk.type = 'button'; pk.className = 'pick';
            pk.innerHTML = '<i class="fa-solid fa-check"></i>'; pk.title = 'Chagua';
            pk.onclick = function () { stMusicPick(it); };
            row.appendChild(img); row.appendChild(t); row.appendChild(pv); row.appendChild(pk);
            r.appendChild(row);
        });
    }
    window.stMusicPick = function (it) {
        stPrevStop();
        $('stMusicTitle').value = it.title; $('stMusicArtist').value = it.artist;
        $('stMusicUrl').value = it.url; $('stMusicCover').value = it.cover || '';
        $('stChipImg').src = it.cover || '';
        $('stChipTitle').textContent = it.title; $('stChipArtist').textContent = it.artist;
        $('stMusicChip').classList.add('show');
        $('stMusicPanel').classList.remove('show');
    };
    window.stMusicClear = function () {
        ['stMusicTitle', 'stMusicArtist', 'stMusicUrl', 'stMusicCover'].forEach(function (id) { var e = $(id); if (e) e.value = ''; });
        var c = $('stMusicChip'); if (c) c.classList.remove('show');
    };

    // ===== Viewer: kadi ndogo ya wimbo =====
    window.stShowMusicChip = function (item) {
        var c = $('statusMusicChip');
        if (!c) return;
        if (!item || !item.music_title) { c.style.display = 'none'; return; }
        $('statusMusicChipTitle').textContent = item.music_title;
        $('statusMusicChipArtist').textContent = item.music_artist || '';
        var im = $('statusMusicChipImg');
        if (item.music_cover) { im.src = item.music_cover; im.style.display = ''; } else { im.style.display = 'none'; }
        c.style.display = 'flex';
    };
    window.stHideMusicChip = function () { var c = $('statusMusicChip'); if (c) c.style.display = 'none'; };

    function init() {
        build();
        var f = $('statusFile');
        if (f) f.addEventListener('change', stSync);
        stSync();
        // Pakia fonts baada ya ukurasa kuwa tayari
        if (document.readyState === 'complete') loadFonts(); else window.addEventListener('load', loadFonts);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
