{# ===== Comment bottom sheet (feed) — nusu skrini, post juu, comments chini, composer ya kisasa ===== #}
<style>
/* ---------- Sheet ---------- */
html.cs-lock, html.cs-lock body { overflow: hidden !important; }
.cs-overlay {
    position: fixed; inset: 0; z-index: 100009;
    background: rgba(8, 15, 26, .45);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.cs-overlay.on { opacity: 1; pointer-events: auto; }
.cs-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100010;
    height: 56vh; height: 56dvh; min-height: 340px; max-height: 94dvh;
    max-width: 720px; margin: 0 auto;
    display: flex; flex-direction: column;
    background: #fff; border-radius: 26px 26px 0 0;
    box-shadow: 0 -18px 50px rgba(15, 23, 42, .28);
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.22,.9,.3,1), height .28s ease, bottom .2s ease;
    overflow: hidden; overscroll-behavior: contain;
}
.cs-sheet.on { transform: translateY(0); }
.cs-sheet.drag { transition: none; }
.cs-sheet.full { height: 92vh; height: 92dvh; }
.cs-grab { padding: 10px 0 4px; display: flex; justify-content: center; cursor: grab; touch-action: none; flex: 0 0 auto; }
.cs-grab span { width: 44px; height: 5px; border-radius: 99px; background: #d3dae2; }
.cs-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 16px 10px 20px; flex: 0 0 auto; touch-action: none;
}
.cs-head h3 { margin: 0; font-size: 19px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; }
.cs-count {
    font-size: 12px; font-weight: 700; color: #138a2b; background: #e8f8ec;
    padding: 2px 9px; border-radius: 99px; display: none;
}
.cs-count.show { display: inline-block; }
.cs-close {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: #eef1f6; color: #475569; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: transform .15s, background .15s;
}
.cs-close:active { transform: scale(.92); background: #e2e8f0; }

/* post juu */
.cs-post {
    flex: 0 0 auto; margin: 0 14px 8px; padding: 10px 12px;
    background: linear-gradient(135deg, #f6fbf8, #f3f8fd);
    border: 1px solid #e6eef0; border-radius: 16px;
    display: flex; align-items: center; gap: 10px; min-height: 58px;
}
.cs-post:empty { display: none; }
.cs-av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #e4e6eb; flex-shrink: 0; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.cs-pt { flex: 1; min-width: 0; }
.cs-pn { font-size: 13.5px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-pn span { font-weight: 500; color: #94a3b8; font-size: 12px; margin-left: 4px; }
.cs-pc { font-size: 12.5px; color: #475569; line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.cs-thumb { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #0f172a; position: relative; }
.cs-thumbwrap { position: relative; flex-shrink: 0; width: 50px; height: 50px; }
.cs-thumbwrap video, .cs-thumbwrap img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; background: #0f172a; display: block; }
.cs-thumbwrap i { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

/* body (comments + composer) */
.cs-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #eef1f4; }
#cs-body .comments-section,
#cs-body .comments-section.active {
    display: flex !important; flex-direction: column; flex: 1 1 auto; min-height: 0; margin: 0; height: 100%;
}
#cs-body .comments-box {
    flex: 1 1 auto; min-height: 0; max-height: none; background: transparent;
    padding: 10px 14px 6px; margin: 0; border-radius: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
#cs-body .comment-item {
    background: #f6f8fa; box-shadow: none; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px;
}
#cs-body .reply-item { border-radius: 12px !important; background: #eef2f6 !important; }

/* empty state */
.cm-first { display: none; }
#cs-body .comments-section.cm-is-empty .comments-box { display: none; }
#cs-body .comments-section.cm-is-empty .cm-first {
    display: flex; flex: 1 1 auto; min-height: 0; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px 28px; gap: 10px;
}
.cm-first-orb {
    position: relative; width: 66px; height: 66px; border-radius: 22px;
    background: linear-gradient(135deg, #1EB53A, #00A3DD);
    color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(30,181,58,.35); animation: cmFloat 3.2s ease-in-out infinite;
}
.cm-first-orb::after {
    content: ''; position: absolute; inset: -7px; border-radius: 27px;
    border: 2px solid rgba(30,181,58,.28); animation: cmRing 2.4s ease-out infinite;
}
.cm-spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #F5B800; animation: cmTwinkle 2s ease-in-out infinite; }
.cm-spark.s1 { top: -10px; right: -6px; }
.cm-spark.s2 { bottom: -6px; left: -12px; width: 6px; height: 6px; background: #00A3DD; animation-delay: .6s; }
.cm-spark.s3 { top: 6px; left: -16px; width: 5px; height: 5px; background: #1EB53A; animation-delay: 1.1s; }
.cm-first-badge {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 99px;
    font-size: 13.5px; font-weight: 800; letter-spacing: .1px; color: #fff;
    background: linear-gradient(110deg, #0f172a 0%, #14532d 55%, #0f172a 100%); background-size: 200% 100%;
    box-shadow: 0 8px 20px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.18);
    animation: cmShine 3.5s linear infinite;
}
.cm-first-badge i { color: #F5B800; font-size: 13px; }
.cm-first p { margin: 0; font-size: 12.5px; color: #64748b; line-height: 1.45; max-width: 260px; }
@keyframes cmFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes cmRing { 0% { transform: scale(.92); opacity: .9 } 100% { transform: scale(1.3); opacity: 0 } }
@keyframes cmTwinkle { 0%,100% { transform: scale(.6); opacity: .35 } 50% { transform: scale(1.15); opacity: 1 } }
@keyframes cmShine { 0% { background-position: 0% 0 } 100% { background-position: 200% 0 } }/* ---------- Composer (inatumika kila mahali comment-form hii ipo) ---------- */
.comment-form.cm-composer {
    flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px;
    position: relative; flex: 0 0 auto;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: #fff; border-top: 1px solid #eef1f4;
}
.cm-composer .cm-pill {
    display: flex; align-items: center; gap: 4px;
    background: #f3f5f8; border: 1.5px solid #e3e8ee; border-radius: 99px;
    padding: 5px 5px 5px 5px; transition: border-color .2s, box-shadow .2s, background .2s;
}
.cm-composer .cm-pill:focus-within {
    background: #fff; border-color: #1EB53A; box-shadow: 0 0 0 4px rgba(30,181,58,.12);
}.comment-form.cm-composer .cm-pill input[name="content"],
.reply-form.cm-composer .cm-pill input[name="content"] {
    flex: 1; min-width: 0; border: 0 !important; background: transparent !important; box-shadow: none !important;
    padding: 9px 6px; font-size: 14.5px; color: #0f172a; outline: none; border-radius: 0;
}.comment-form.cm-composer .cm-pill input[name="content"]::placeholder,
.reply-form.cm-composer .cm-pill input[name="content"]::placeholder { color: #94a3b8; }.comment-form.cm-composer .cm-pill button,
.reply-form.cm-composer .cm-pill button {
    width: 36px; height: 36px; border-radius: 50%; border: 0; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: transform .18s ease, background .2s, color .2s, box-shadow .2s;
}.comment-form.cm-composer .cm-pill .cm-plus,
.reply-form.cm-composer .cm-pill .cm-plus { background: #e6f7ea; color: #1EB53A; font-size: 16px; }.comment-form.cm-composer .cm-pill .cm-plus:hover,
.reply-form.cm-composer .cm-pill .cm-plus:hover { background: #d7f1de; }.comment-form.cm-composer .cm-pill .cm-plus.open,
.reply-form.cm-composer .cm-pill .cm-plus.open { background: #0f172a; color: #fff; transform: rotate(135deg); }.comment-form.cm-composer .cm-pill .lnk-tgl,
.reply-form.cm-composer .cm-pill .lnk-tgl { background: transparent; color: #64748b; width: 34px; height: 34px; }.comment-form.cm-composer .cm-pill .lnk-tgl:hover,
.reply-form.cm-composer .cm-pill .lnk-tgl:hover { background: #e9edf2; }.comment-form.cm-composer .cm-pill .lnk-tgl.on,
.reply-form.cm-composer .cm-pill .lnk-tgl.on { background: #1EB53A; color: #fff; }.comment-form.cm-composer .cm-pill .cm-send,
.reply-form.cm-composer .cm-pill .cm-send {
    background: linear-gradient(135deg, #1EB53A, #00A3DD); color: #fff;
    box-shadow: 0 6px 14px rgba(30,181,58,.35); width: 38px; height: 38px;
}.comment-form.cm-composer .cm-pill .cm-send:active,
.reply-form.cm-composer .cm-pill .cm-send:active { transform: scale(.9); }
.cm-composer .cm-pill:not(.ready) .cm-send { background: #cfd7e0; box-shadow: none; }
.cm-composer .cm-pill.ready .cm-send i { animation: cmPop .35s ease; }
@keyframes cmPop { 0% { transform: scale(.6) rotate(-20deg) } 100% { transform: scale(1) rotate(0) } }
.cm-composer.cm-sending .cm-send i { display: none; }
.cm-composer.cm-sending .cm-send::after {
    content: ''; width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; animation: cmSpin .7s linear infinite;
}
@keyframes cmSpin { to { transform: rotate(360deg) } }
.cm-composer.cm-shake .cm-pill { animation: cmShake .35s ease; border-color: #f87171; }
@keyframes cmShake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

/* menu ya + */
.cm-menu[hidden], .cm-preview[hidden] { display: none !important; }
.cm-menu {
    display: flex; gap: 8px; padding: 8px; background: #fff; border: 1px solid #e6ebf1; border-radius: 18px;
    box-shadow: 0 14px 34px rgba(15,23,42,.16); align-self: flex-start; animation: cmMenuIn .18s ease;
}
@keyframes cmMenuIn { from { opacity: 0; transform: translateY(8px) scale(.96) } to { opacity: 1; transform: none } }.comment-form.cm-composer .cm-menu button,
.reply-form.cm-composer .cm-menu button {
    width: auto; height: auto; border-radius: 12px; padding: 9px 14px; gap: 8px; font-size: 13.5px; font-weight: 700;
    background: #f3f5f8; color: #0f172a; display: flex; align-items: center; border: 0; cursor: pointer;
}.comment-form.cm-composer .cm-menu button i,
.reply-form.cm-composer .cm-menu button i { font-size: 16px; }.comment-form.cm-composer .cm-menu button:first-child i,
.reply-form.cm-composer .cm-menu button:first-child i { color: #1EB53A; }.comment-form.cm-composer .cm-menu button:last-child i,
.reply-form.cm-composer .cm-menu button:last-child i { color: #00A3DD; }.comment-form.cm-composer .cm-menu button:hover,
.reply-form.cm-composer .cm-menu button:hover { background: #e8edf3; }/* link row ndani ya composer */
.comment-form.cm-composer .lnk-row,
/* link row ndani ya composer */
.reply-form.cm-composer .lnk-row { flex: 0 0 auto; margin: 0; }.comment-form.cm-composer .lnk-row input,
.reply-form.cm-composer .lnk-row input {
    border-radius: 14px; padding: 9px 12px; font-size: 13px; background: #f3f5f8; border: 1.5px solid #e3e8ee;
}

/* preview ya media kabla ya kutuma */
.cm-preview { display: flex; align-items: center; gap: 10px; padding: 6px; background: #f6f8fa; border-radius: 16px; border: 1px dashed #cfd8e3; }
.cm-chip { position: relative; width: 58px; height: 58px; border-radius: 12px; overflow: hidden; background: #0f172a; flex-shrink: 0; }
.cm-chip img, .cm-chip video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cm-chip-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; background: rgba(0,0,0,.25); }
.comment-form .cm-chip-x, .reply-form .cm-chip-x {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0;
    background: rgba(15,23,42,.8); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.cm-chip-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cm-chip-meta b { font-size: 12.5px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.cm-chip-meta span { font-size: 11.5px; color: #64748b; }


/* media ndani ya comment */
.cm-media { margin: 6px 0 4px; max-width: 250px; border-radius: 14px; overflow: hidden; background: #0f172a; box-shadow: 0 2px 8px rgba(15,23,42,.12); }
.cm-media img { display: block; width: 100%; max-height: 280px; object-fit: cover; cursor: zoom-in; }
.cm-media video { display: block; width: 100%; max-height: 300px; background: #000; }
.reply-item .cm-media { max-width: 200px; border-radius: 12px; }
.cm-lightbox {
    position: fixed; inset: 0; z-index: 100100; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: cmMenuIn .2s ease;
}
.cm-lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }
.cm-lightbox button {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; cursor: pointer;
}

/* arena ya video (giza) */
#video-detail-arena .cm-composer { background: transparent; border-top: 0; padding: 6px 4px 4px; }#video-detail-arena .comment-form.cm-composer .cm-pill,
#video-detail-arena .reply-form.cm-composer .cm-pill { background: #123222; border-color: #1EB53A66; }#video-detail-arena .comment-form.cm-composer .cm-pill input[name="content"],
#video-detail-arena .reply-form.cm-composer .cm-pill input[name="content"] { background: transparent !important; border: 0 !important; color: #fff; }#video-detail-arena .comment-form.cm-composer .cm-pill .cm-plus,
#video-detail-arena .reply-form.cm-composer .cm-pill .cm-plus { background: rgba(255,255,255,.14) !important; color: #fff; }#video-detail-arena .comment-form.cm-composer .cm-pill .cm-plus.open,
#video-detail-arena .reply-form.cm-composer .cm-pill .cm-plus.open { background: #fff !important; color: #0f172a; }#video-detail-arena .comment-form.cm-composer .cm-pill .lnk-tgl,
#video-detail-arena .reply-form.cm-composer .cm-pill .lnk-tgl { background: transparent !important; color: #cbd5e1; }#video-detail-arena .comment-form.cm-composer .cm-pill .lnk-tgl.on,
#video-detail-arena .reply-form.cm-composer .cm-pill .lnk-tgl.on { background: #1EB53A !important; color: #fff; }#video-detail-arena .comment-form.cm-composer .cm-pill .cm-send,
#video-detail-arena .reply-form.cm-composer .cm-pill .cm-send { background: linear-gradient(135deg, #1EB53A, #00A3DD) !important; }
#video-detail-arena .cm-composer .cm-pill:not(.ready) .cm-send { background: #3a4a42 !important; }
#video-detail-arena .cm-preview { background: #123222; border-color: #1EB53A66; }
#video-detail-arena .cm-chip-meta b { color: #fff; }

/* ---------- Reply composer (kama ya kwanza, ndogo kidogo) ---------- */
.reply-form.cm-composer { margin: 8px 0 2px; padding: 0; min-width: 0; max-width: 100%; box-sizing: border-box; }
.reply-form.cm-composer > * + * { margin-top: 8px; }
.reply-form.cm-composer .cm-pill { padding: 4px; max-width: 100%; box-sizing: border-box; }
.reply-form.cm-composer .cm-pill button { width: 32px; height: 32px; font-size: 14px; }
.reply-form.cm-composer .cm-pill .lnk-tgl { width: 30px; height: 30px; }
.reply-form.cm-composer .cm-pill .cm-send { width: 34px; height: 34px; }
.reply-form.cm-composer .cm-pill input[name="content"] { font-size: 14px; padding: 7px 4px; }
.reply-form.cm-composer .cm-menu { display: flex; width: fit-content; max-width: 100%; }
.reply-form.cm-composer .cm-menu[hidden] { display: none !important; }
.reply-form.cm-composer .cm-preview { padding: 4px; }
.reply-form.cm-composer .cm-chip { width: 46px; height: 46px; }
#cs-body .comments-box { overflow-x: hidden; }
</style>

<div class="cs-overlay" id="cs-overlay" onclick="closeCommentSheet()"></div>
<div class="cs-sheet" id="cs-sheet" role="dialog" aria-modal="true" aria-label="comments">
    <div class="cs-grab" id="cs-grab"><span></span></div>
    <div class="cs-head" id="cs-head">
        <h3>comments <span class="cs-count" id="cs-count"></span></h3>
        <button type="button" class="cs-close" onclick="closeCommentSheet()" aria-label="close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cs-post" id="cs-post"></div>
    <div class="cs-body" id="cs-body"></div>
</div>

<script>
(function () {
    var sheet = document.getElementById('cs-sheet');
    var overlay = document.getElementById('cs-overlay');
    var bodyEl = document.getElementById('cs-body');
    var postEl = document.getElementById('cs-post');
    var countEl = document.getElementById('cs-count');
    var state = { id: null, section: null, ph: null, obs: null };
    var typing = false;

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function toast(m, t) { if (typeof showToast === 'function') showToast(m, t || 'error'); }
    function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }

    /* ---------- Post ya juu ---------- */
    function buildPost(id) {
        var card = document.getElementById('post-card-' + id);
        if (!card) { postEl.innerHTML = ''; return; }
        var a = card.querySelector('.post-header-info strong a');
        var name = a ? a.textContent.trim() : '';
        var im = card.querySelector('.post-header img');
        var av = im ? im.getAttribute('src') : '';
        var tm = card.querySelector('.post-time-line .rel-time');
        var when = tm ? tm.textContent.trim() : '';
        var pc = card.querySelector('.post-content');
        var cap = pc ? pc.textContent.trim() : '';
        var mi = card.querySelector('.post-media img');
        var mv = card.querySelector('.post-media video');
        var thumb = '';
        if (mi && mi.getAttribute('src')) {
            thumb = '<div class="cs-thumbwrap"><img src="' + esc(mi.getAttribute('src')) + '" alt=""></div>';
        } else if (mv && (mv.getAttribute('src') || mv.currentSrc)) {
            thumb = '<div class="cs-thumbwrap"><video src="' + esc(mv.getAttribute('src') || mv.currentSrc) + '#t=0.1" muted playsinline preload="metadata"></video><i class="fa-solid fa-play"></i></div>';
        }
        if (!cap) cap = thumb ? (mv ? 'video' : 'Picha') : '';
        var fb = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name || 'U') + '&background=random&color=fff&size=72&bold=true';
        postEl.innerHTML =
            '<img class="cs-av" src="' + esc(av || fb) + '" alt="" onerror="this.onerror=null;this.src=\'' + fb + '\'">' +
            '<div class="cs-pt"><div class="cs-pn">' + esc(name) + (when ? '<span>' + esc(when) + '</span>' : '') + '</div>' +
            (cap ? '<div class="cs-pc">' + esc(cap) + '</div>' : '') + '</div>' + thumb;
    }

    /* ---------- Hali ya "hakuna comment" + hesabu ---------- */
    function syncState() {
        var id = state.id, sec = state.section;
        if (!id || !sec) return;
        var list = document.getElementById('comments-list-' + id);
        var has = !!(list && list.querySelector('.comment-item'));
        sec.classList.toggle('cm-is-empty', !has);
        var inp = sec.querySelector('.comment-form.cm-composer input[name="content"]');
        if (inp) inp.placeholder = has ? (inp.getAttribute('data-ph') || 'Andika maoni...') : 'Kuwa wa kwanza kucomment...';
        var cs = document.getElementById('comments-count-text-' + id);
        var n = cs ? parseInt(cs.textContent, 10) : (list ? list.querySelectorAll('.comment-item').length : 0);
        if (isNaN(n)) n = 0;
        if (!has) n = 0;
        countEl.textContent = n;
        countEl.classList.toggle('show', n > 0);
    }

    function restoreOthers() {
        ['_vdaMoved', '_imgMoved'].forEach(function (k) {
            if (window[k + 'Section'] && typeof restoreFeedCommentsSection === 'function') {
                restoreFeedCommentsSection(window[k + 'Section'], window[k + 'Placeholder']);
                window[k + 'Section'] = null;
                window[k + 'Placeholder'] = null;
            }
        });
    }

    /* ---------- open / funga ---------- */
    window.openCommentSheet = function (postId) {
        postId = parseInt(postId, 10);
        if (state.id === postId) { window.closeCommentSheet(); return; }
        if (state.id) window.closeCommentSheet(true);
        restoreOthers();
        var section = document.getElementById('comments-section-' + postId);
        if (!section) { toast('Maoni hayapatikani kwa sasa'); return; }
        var ph = document.createElement('div');
        ph.style.display = 'none';
        section.parentNode.insertBefore(ph, section);
        bodyEl.appendChild(section);
        section.classList.add('active');
        section.style.display = 'block';
        state = { id: postId, section: section, ph: ph, obs: null };

        buildPost(postId);
        var list = document.getElementById('comments-list-' + postId);
        if (list && window.MutationObserver) {
            state.obs = new MutationObserver(syncState);
            state.obs.observe(list, { childList: true, subtree: true });
        }
        syncState();

        sheet.classList.remove('full');
        document.documentElement.classList.add('cs-lock');
        overlay.classList.add('on');
        sheet.classList.add('on');
        if (list) list.scrollTop = list.scrollHeight;
    };

    window.closeCommentSheet = function (silent) {
        if (state.obs) { try { state.obs.disconnect(); } catch (e) {} }
        bodyEl.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (e) {} });
        if (state.section) {
            state.section.classList.remove('cm-is-empty');
            var inp = state.section.querySelector('.comment-form.cm-composer input[name="content"]');
            if (inp && inp.getAttribute('data-ph')) inp.placeholder = inp.getAttribute('data-ph');
            state.section.querySelectorAll('.cm-menu').forEach(function (m) { m.setAttribute('hidden', ''); });
            state.section.querySelectorAll('.cm-plus.open').forEach(function (b) { b.classList.remove('open'); });
            if (typeof restoreFeedCommentsSection === 'function') restoreFeedCommentsSection(state.section, state.ph);
        }
        state = { id: null, section: null, ph: null, obs: null };
        typing = false;
        sheet.style.height = ''; sheet.style.bottom = ''; sheet.style.transform = '';
        sheet.classList.remove('on', 'full', 'drag');
        overlay.classList.remove('on');
        postEl.innerHTML = '';
        if (!silent) document.documentElement.classList.remove('cs-lock');
        else document.documentElement.classList.add('cs-lock');
        if (document.activeElement && document.activeElement.blur) { try { document.activeElement.blur(); } catch (e) {} }
    };

    /* kitufe cha Comment cha feed sasa kinafungua sheet */
    window.toggleComments = function (postId) { window.openCommentSheet(postId); };

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && state.id) window.closeCommentSheet();
    });

    /* ---------- Kuvuta (drag) ---------- */
    var drag = null;
    function dStart(e) {
        if (e.target.closest && e.target.closest('.cs-close')) return;
        drag = { y: e.touches[0].clientY, dy: 0 };
        sheet.classList.add('drag');
    }
    function dMove(e) {
        if (!drag) return;
        drag.dy = e.touches[0].clientY - drag.y;
        if (e.cancelable) e.preventDefault();
        if (drag.dy > 0) sheet.style.transform = 'translateY(' + drag.dy + 'px)';
    }
    function dEnd() {
        if (!drag) return;
        var dy = drag.dy;
        drag = null;
        sheet.classList.remove('drag');
        sheet.style.transform = '';
        if (Math.abs(dy) < 6) { sheet.classList.toggle('full'); return; }
        if (dy > 110) { if (sheet.classList.contains('full')) sheet.classList.remove('full'); else window.closeCommentSheet(); }
        else if (dy < -60) sheet.classList.add('full');
    }
    ['cs-grab', 'cs-head'].forEach(function (id) {
        var el = document.getElementById(id);
        el.addEventListener('touchstart', dStart, { passive: true });
        el.addEventListener('touchmove', dMove, { passive: false });
        el.addEventListener('touchend', dEnd);
        el.addEventListener('touchcancel', dEnd);
    });

    /* ---------- Keyboard ya simu ---------- */
    var vv = window.visualViewport;
    function onVV() {
        if (!sheet.classList.contains('on')) return;
        if (typing && vv) {
            var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            sheet.style.bottom = kb + 'px';
            sheet.style.height = Math.max(300, Math.min(window.innerHeight * 0.9, vv.height - 12)) + 'px';
        } else {
            sheet.style.bottom = '';
            sheet.style.height = '';
        }
    }
    if (vv) { vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV); }
    sheet.addEventListener('focusin', function (e) {
        if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { typing = true; onVV(); }
    });
    sheet.addEventListener('focusout', function () {
        setTimeout(function () {
            var ae = document.activeElement;
            if (!(ae && sheet.contains(ae) && /^(INPUT|TEXTAREA)$/.test(ae.tagName))) { typing = false; onVV(); }
        }, 150);
    });

    /* ================= Composer: picha / video / ready / submit ================= */
    function formOf(el) { return el && el.closest ? el.closest('form') : null; }
    function closeMenu(form) {
        if (!form) return;
        var m = form.querySelector('.cm-menu'); if (m) m.setAttribute('hidden', '');
        var b = form.querySelector('.cm-plus'); if (b) b.classList.remove('open');
    }
    function updReady(form) {
        var pill = form && form.querySelector('.cm-pill');
        if (!pill) return;
        var t = form.querySelector('input[name="content"]');
        var f = form.querySelector('.cm-file');
        var l = form.querySelector('input[name="link_url"]');
        var ok = !!((t && t.value.trim()) || (f && f.files && f.files.length) || (l && l.value.trim()));
        pill.classList.toggle('ready', ok);
    }
    function clearPreview(form) {
        var pv = form.querySelector('.cm-preview');
        if (form._cmUrl) { try { URL.revokeObjectURL(form._cmUrl); } catch (e) {} form._cmUrl = null; }
        if (pv) { pv.innerHTML = ''; pv.setAttribute('hidden', ''); }
    }
    function renderPreview(form, file) {
        var pv = form.querySelector('.cm-preview');
        if (!pv) {
            pv = document.createElement('div');
            pv.className = 'cm-preview';
            form.insertBefore(pv, form.firstChild);
        }
        if (form._cmUrl) { try { URL.revokeObjectURL(form._cmUrl); } catch (e) {} }
        var url = URL.createObjectURL(file);
        form._cmUrl = url;
        var isV = file.type.indexOf('video/') === 0;
        pv.innerHTML =
            '<div class="cm-chip">' +
            (isV ? '<video src="' + url + '#t=0.1" muted playsinline preload="metadata"></video><span class="cm-chip-play"><i class="fa-solid fa-play"></i></span>'
                 : '<img src="' + url + '" alt="">') +
            '<button type="button" class="cm-chip-x" onclick="cmClearMedia(this)" aria-label="remove"><i class="fa-solid fa-xmark"></i></button></div>' +
            '<div class="cm-chip-meta"><b>' + esc(file.name) + '</b><span>' + (isV ? 'video' : 'Picha') + ' · ' + fmtSize(file.size) + '</span></div>';
        pv.removeAttribute('hidden');
    }

    window.cmTogglePlus = function (btn) {
        var form = formOf(btn); if (!form) return;
        var m = form.querySelector('.cm-menu'); if (!m) return;
        var opening = m.hasAttribute('hidden');
        if (opening) { m.removeAttribute('hidden'); btn.classList.add('open'); }
        else closeMenu(form);
    };
    window.cmChoose = function (btn, kind) {
        var form = formOf(btn); if (!form) return;
        var f = form.querySelector('.cm-file'); if (!f) return;
        f.accept = kind === 'video' ? 'video/*' : 'image/*';
        closeMenu(form);
        f.click();
    };
    window.cmPickFile = function (btn) {
        var form = formOf(btn); if (!form) return;
        var f = form.querySelector('.cm-file'); if (!f) return;
        f.accept = 'image/*,video/*';
        f.click();
    };
    window.cmFileChosen = function (inp) {
        var form = formOf(inp); if (!form) return;
        var file = inp.files && inp.files[0];
        if (!file) { clearPreview(form); updReady(form); return; }
        var isV = file.type.indexOf('video/') === 0, isI = file.type.indexOf('image/') === 0;
        if (!isV && !isI) { inp.value = ''; toast('Chagua picha au video tu.'); return; }
        if (isI && file.size > 500 * 1048576) { inp.value = ''; toast('Picha isizidi 500MB.'); return; }
        if (isV && file.size > 500 * 1048576) { inp.value = ''; toast('Video isizidi 500MB.'); return; }
        renderPreview(form, file);
        updReady(form);
    };
    window.cmClearMedia = function (btn) {
        var form = formOf(btn); if (!form) return;
        var f = form.querySelector('.cm-file'); if (f) f.value = '';
        clearPreview(form);
        updReady(form);
    };
    window.cmOpenMedia = function (img) {
        var box = document.createElement('div');
        box.className = 'cm-lightbox';
        box.innerHTML = '<img src="' + esc(img.currentSrc || img.src) + '" alt=""><button type="button" aria-label="close"><i class="fa-solid fa-xmark"></i></button>';
        box.addEventListener('click', function () { box.remove(); });
        document.body.appendChild(box);
    };

    /* comments zilizojengwa na JS */
    window.cmMediaHtml = function (c) {
        if (!c) return '';
        var u = c.media_url || '';
        if (!u && c.media_path) u = /^(\/|https?:)/.test(c.media_path) ? c.media_path : '/static/uploads/' + c.media_path;
        if (!u) return '';
        if (c.media_type === 'video') {
            return '<div class="cm-media"><video src="' + esc(u) + '" controls playsinline preload="metadata"></video></div>';
        }
        return '<div class="cm-media"><img src="' + esc(u) + '" alt="" loading="lazy" onclick="cmOpenMedia(this)"></div>';
    };
    /* ndani ya form ya reply inayojengwa na JS (comment mpya) — sawa kabisa na ya server */
    window.cmComposerInner = function (ph) {
        ph = ph || 'Andika jibu...';
        return '<div class="cm-preview" hidden></div>' +
            '<div class="lnk-row"><input type="text" name="link_label" maxlength="30" placeholder="button_label (mfano: Kijiji)" autocomplete="off">' +
            '<input type="text" name="link_url" inputmode="url" maxlength="500" placeholder="Link (https://...)" autocomplete="off"></div>' +
            '<div class="cm-menu" hidden>' +
            '<button type="button" onclick="cmChoose(this,\'image\')"><i class="fa-regular fa-image"></i><span>image</span></button>' +
            '<button type="button" onclick="cmChoose(this,\'video\')"><i class="fa-solid fa-video"></i><span>video</span></button></div>' +
            '<div class="cm-pill">' +
            '<button type="button" class="cm-plus" onclick="cmTogglePlus(this)" title="add picha au video" aria-label="add picha au video"><i class="fa-solid fa-plus"></i></button>' +
            '<input type="text" name="content" placeholder="' + esc(ph) + '" data-ph="' + esc(ph) + '" autocomplete="off" enterkeyhint="send">' +
            '<button type="button" class="lnk-tgl" onclick="lnkToggle(this)" title="Weka link" aria-label="Weka link"><i class="fa-solid fa-link"></i></button>' +
            '<button type="submit" class="cm-send" aria-label="send"><i class="fa-solid fa-paper-plane"></i></button></div>' +
            '<input type="file" name="media" class="cm-file" accept="image/*,video/*" hidden onchange="cmFileChosen(this)">';
    };

    /* Reply kwa reply: kila "Reply" inafungua composer ya comment kuu na @jina, bila kikomo */
    var _rtu = window.replyToUser;
    window.replyToUser = function (mainId) {
        if (_rtu) _rtu.apply(this, arguments);
        document.querySelectorAll('#reply-form-' + mainId).forEach(function (f) {
            updReady(f);
            var i = f.querySelector('input[name="content"]');
            if (i) { try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} }
            try { f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
        });
    };
    var _srb = window.showReplyBox;
    window.showReplyBox = function (id) {
        if (_srb) _srb.apply(this, arguments);
        document.querySelectorAll('#reply-form-' + id).forEach(function (f) {
            if (f.style.display !== 'none') {
                var i = f.querySelector('input[name="content"]');
                if (i) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } }
                try { f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
            }
        });
    };

    /* ---------- Listeners za kimataifa ---------- */
    document.addEventListener('input', function (e) {
        var form = e.target && e.target.closest ? e.target.closest('.cm-composer') : null;
        if (form) updReady(form);
    });
    document.addEventListener('click', function (e) {
        document.querySelectorAll('.cm-menu:not([hidden])').forEach(function (m) {
            var form = formOf(m);
            if (form && !(e.target.closest && e.target.closest('.cm-plus')) && !m.contains(e.target)) closeMenu(form);
        });
    });
    document.addEventListener('reset', function (e) {
        var f = e.target;
        if (f && f.querySelector && f.querySelector('.cm-file')) {
            setTimeout(function () { clearPreview(f); updReady(f); closeMenu(f); }, 0);
        }
    }, true);
    document.addEventListener('submit', function (e) {
        var f = e.target;
        if (!f || !f.querySelector || !f.querySelector('.cm-file')) return;
        if (f.classList.contains('cm-sending')) { e.preventDefault(); e.stopPropagation(); return; }
        var t = f.querySelector('input[name="content"]');
        var l = f.querySelector('input[name="link_url"]');
        var has = !!((t && t.value.trim()) || (f.querySelector('.cm-file').files.length) || (l && l.value.trim()));
        if (!has) {
            e.preventDefault(); e.stopPropagation();
            f.classList.remove('cm-shake'); void f.offsetWidth; f.classList.add('cm-shake');
            if (t) t.focus();
            setTimeout(function () { f.classList.remove('cm-shake'); }, 400);
        } else {
            closeMenu(f);
        }
    }, true);
})();
</script>
