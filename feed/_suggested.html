<div class="suggest-follow-wrap" style="margin:0 0 12px;">

    <!-- HEADER -->

        <i class="fa-solid fa-user-plus" style="color:#1EB53A;"></i>
        <strong style="font-size:13px;color:#1c1e21;">
            Watu wa kufollow

    </div>

    <!-- HORIZONTAL SCROLL -->

         style="display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;">

        

        <!-- SUGGESTION CARD -->

             style="flex:0 0 98px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:8px 6px 8px;text-align:center;">

            <!-- PROFILE LINK -->
            <a href="/profile/"
               style="text-decoration:none;color:inherit;display:block;">

                <!-- PROFILE PICTURE -->
                <div style="position:relative;width:44px;height:44px;margin:0 auto 5px;">

                    <img src=""
                         alt=""
                         style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #1EB53A;background:#e4e6eb;"
                         onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=&background=random&color=fff&size=128&bold=true';">

                </div>

                <!-- NAME + VERIFIED BADGE -->

                    <span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">

                        
                            
                        
                            
                        

                    </span>

                    

                    <svg class="verified-badge-custom"
                         viewBox="0 0 24 24"

                              fill="#FFFFFF"/>

                    </svg>

                    

                </div>

                <!-- USERNAME -->
                <div style="font-size:10px;color:#65676b;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">

                    @

                </div>

            </a>

            <!-- FOLLOW BUTTON -->
            <button type="button"
                    onclick="followUser('', this)"
                    style="margin-top:6px;width:100%;border:none;border-radius:14px;padding:4px 0;font-weight:700;font-size:11px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#00A3DD,#1EB53A);">

                

                    following
