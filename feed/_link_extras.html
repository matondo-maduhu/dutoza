<style>
    /* ===== Kitufe cha link (link imefichwa nyuma ya jina) ===== */
    .lnk-btn {
        display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
        margin: 8px 0 4px; padding: 10px 18px; border: none; border-radius: 22px;
        background: linear-gradient(90deg, #00A3DD, #1EB53A); color: #fff;
        font-weight: 700; font-size: 14px; font-family: inherit; line-height: 1.2; text-align: left;
        cursor: pointer; box-shadow: 0 2px 8px rgba(0, 163, 221, .25);
        -webkit-tap-highlight-color: transparent;
    }
    .lnk-btn:active { transform: scale(.97); }
    .lnk-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .lnk-btn .ext { opacity: .85; font-size: 11px; flex: 0 0 auto; }
    .lnk-btn.sm { padding: 6px 13px; font-size: 12px; margin: 5px 0 2px; gap: 6px; }
    .lnk-wrap-post { padding: 0 2px; }
    .lnk-slot { margin-top: 6px; }
    .lnk-slot .lnk-btn { margin: 4px 0; }

    /* ===== Sehemu ya kuandika link kwenye comment / reply ===== */
    .comment-form.lnk-wrap { flex-wrap: wrap; align-items: center; }
    .lnk-row { display: none; flex: 1 1 100%; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .lnk-row.show { display: flex; }
    .lnk-row input { flex: 1 1 130px; min-width: 0; }
    .reply-form .lnk-row input {
        padding: 6px 10px; font-size: 12px; border-radius: 12px; border: 1px solid #ccd0d5; outline: none; background: #fff;
    }
    .comment-form .lnk-tgl, .lnk-tgl {
        flex: 0 0 auto; width: 35px; height: 35px; border: none; border-radius: 50%;
        background: #e8f8ec; color: #1EB53A; font-size: 14px; cursor: pointer; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .comment-form .lnk-tgl.on, .lnk-tgl.on { background: #1EB53A; color: #fff; }
    .reply-form .lnk-tgl { width: 28px; height: 28px; font-size: 12px; }
    #video-detail-arena .comment-form .lnk-tgl { background: rgba(255,255,255,.14); color: #fff; width: 35px; }
    #video-detail-arena .comment-form .lnk-tgl.on { background: #1EB53A; }
    #video-detail-arena .lnk-row input { background: #1c1c1e; color: #fff; border: 1px solid #3a3a3c; }

    /* ===== Onyo kabla ya kuondoka ===== */
    .lnk-modal {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 7000; display: none;
        align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .6);
    }
    .lnk-modal.show { display: flex; }
    .lnk-box { width: 100%; max-width: 340px; background: #fff; color: #1c1e21; border-radius: 18px; padding: 22px 20px 16px; text-align: center; }
    .lnk-box .ic { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 50%; background: #e8f8ec; color: #1EB53A; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .lnk-box h4 { margin: 0 0 6px; font-size: 17px; }
    .lnk-box .host { font-weight: 800; font-size: 15px; color: #0d7a28; word-break: break-all; }
    .lnk-box .full { margin: 6px 0 4px; font-size: 11px; color: #8a8d91; word-break: break-all; max-height: 48px; overflow: hidden; }
    .lnk-box p { font-size: 12px; color: #65676b; margin: 8px 0 14px; }
    .lnk-box .acts { display: flex; gap: 8px; }
    .lnk-box .acts button { flex: 1; border: none; border-radius: 22px; padding: 11px 8px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
    .lnk-box .b-stay { background: #f0f2f5; color: #1c1e21; }
    .lnk-box .b-go { background: linear-gradient(90deg, #00A3DD, #1EB53A); color: #fff; }
</style>

<script>
(function () {
    if (window.lnkInit) return;
    window.lnkInit = true;

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    // Sheria sawa na server: http/https tu, hakuna nafasi, host yenye nukta, bila user:pass@
    function normalize(u) {
        u = String(u || '').trim();
        if (!u || u.length > 500 || /[\s<>"'\\\u0000-\u001f]/.test(u)) return '';
        if (!/^[a-z][a-z0-9+.\-]*:/i.test(u)) u = 'https://' + u;
        var m = /^(https?):\/\/([^\/?#]*)([\/?#].*)?$/i.exec(u);
        if (!m) return '';
        var host = m[2];
        if (!host || host.indexOf('@') >= 0 || host.indexOf('.') < 1 || /\.$/.test(host)) return '';
        return u;
    }
    function hostOf(u) {
        try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }

    // HTML ya kitufe (kwa comments zinazojengwa na JavaScript)
    window.lnkBtnHtml = function (label, url, small) {
        var u = normalize(url);
        if (!u) return '';
        var l = String(label || '').trim().slice(0, 30) || hostOf(u) || 'open link';
        return '<button type="button" class="lnk-btn' + (small ? ' sm' : '') + '" data-url="' + esc(u) + '" data-label="' + esc(l) +
               '" onclick="openExternalLink(this)"><i class="fa-solid fa-link"></i><span>' + esc(l) +
               '</span><i class="fa-solid fa-arrow-up-right-from-square ext"></i></button>';
    };
    window.LNK_TGL = '<button type="button" class="lnk-tgl" onclick="lnkToggle(this)" title="Weka link" aria-label="Weka link"><i class="fa-solid fa-link"></i></button>';
    window.LNK_ROW = '<div class="lnk-row"><input type="text" name="link_label" maxlength="30" placeholder="button_label (mfano: Kijiji)" autocomplete="off"><input type="text" name="link_url" inputmode="url" maxlength="500" placeholder="Link (https://...)" autocomplete="off"></div>';
    window.lnkNormalize = normalize;
    window.lnkHostOf = hostOf;

    // ===== open link (na onyo mara ya kwanza kwa kila tovuti) =====
    var modal = null, pendingUrl = '';
    function go(url) {
        var a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow ugc';
        a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    }
    function buildModal() {
        modal = document.createElement('div');
        modal.className = 'lnk-modal';
        modal.innerHTML = '<div class="lnk-box"><div class="ic"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>' +
            '<h4>Unaondoka Kijiji</h4><div class="host" id="lnkHost"></div><div class="full" id="lnkFull"></div>' +
            '<p>Link hii imewekwa na mtumiaji. open tu ikiwa unaiamini.</p>' +
            '<div class="acts"><button type="button" class="b-stay" id="lnkStay">Baki hapa</button>' +
            '<button type="button" class="b-go" id="lnkGo">next</button></div></div>';
        document.body.appendChild(modal);
        modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('show'); });
        modal.querySelector('#lnkStay').onclick = function () { modal.classList.remove('show'); };
        modal.querySelector('#lnkGo').onclick = function () {
            modal.classList.remove('show');
            try {
                var seen = JSON.parse(sessionStorage.getItem('lnkOk') || '{}');
                seen[hostOf(pendingUrl)] = 1; sessionStorage.setItem('lnkOk', JSON.stringify(seen));
            } catch (e) {}
            go(pendingUrl);
        };
    }
    window.openExternalLink = function (btn) {
        var url = normalize(btn && btn.dataset ? btn.dataset.url : '');
        if (!url) return;
        var host = hostOf(url), seen = {};
        try { seen = JSON.parse(sessionStorage.getItem('lnkOk') || '{}'); } catch (e) {}
        if (seen[host]) { go(url); return; }
        if (!modal) buildModal();
        pendingUrl = url;
        modal.querySelector('#lnkHost').textContent = host;
        modal.querySelector('#lnkFull').textContent = url;
        modal.classList.add('show');
    };

    // ===== Fomu za comment / reply: kitufe cha kuonyesha sehemu ya link =====
    window.lnkToggle = function (btn) {
        var form = btn.closest('form');
        var row = form && form.querySelector('.lnk-row');
        if (!row) return;
        var on = row.classList.toggle('show');
        btn.classList.toggle('on', on);
        if (on) { var i = row.querySelector('input'); if (i) i.focus(); }
    };
    window.lnkReset = function (form) {
        if (!form) return;
        var row = form.querySelector('.lnk-row'); if (row) row.classList.remove('show');
        var t = form.querySelector('.lnk-tgl'); if (t) t.classList.remove('on');
    };

    // ===== Viewer (picha / video kubwa): onyesha kitufe cha post =====
    window.lnkSlot = function (slotId, el) {
        var slot = document.getElementById(slotId);
        if (!slot) return;
        slot.innerHTML = '';
        var d = el && el.dataset;
        if (!d || !d.linkUrl) return;
        slot.innerHTML = window.lnkBtnHtml(d.linkLabel, d.linkUrl, false);
    };
})();
</script>
