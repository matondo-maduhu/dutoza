    /* ===== music wa post: kadiski ndogo + jina linalozunguka, unaplay wenyewe ===== */
    .post-music {
        display: inline-flex; align-items: center; gap: 8px;
        margin: 6px 0 4px; padding: 3px 12px 3px 3px; max-width: 78%;
        background: rgba(127,127,127,.16); border-radius: 999px; cursor: pointer;
        -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .post-music .pm-disc {
        width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px; position: relative;
        background: conic-gradient(#111, #333, #111, #333, #111); border: 2px solid #111;
        box-shadow: 0 1px 4px rgba(0,0,0,.35); overflow: hidden;
    }
    .post-music .pm-disc img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
    .post-music .pm-disc::after {
        content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
        border-radius: 50%; background: #fff; border: 1.5px solid #111;
    }
    .post-music.playing .pm-disc { animation: pmSpin 3.5s linear infinite; }
    @keyframes pmSpin { to { transform: rotate(360deg); } }
    .post-music .pm-marq {
        overflow: hidden; width: 140px; white-space: nowrap; font-size: 12px; font-weight: 600; color: inherit; opacity: .85;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
                mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    }
    .post-music .pm-marq span { display: inline-block; padding-left: 0; animation: pmMarq 9s linear infinite; }
    .post-music:not(.playing) .pm-marq span { animation-play-state: paused; }
    @keyframes pmMarq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    /* bg ndogo kwa orodha ndogo (explore, hashtag) */
    .post-content.bgt.bgt-sm, .post-content-text.bgt.bgt-sm { aspect-ratio: auto !important; min-height: 130px !important;
        padding: 18px 16px !important; border-radius: 14px !important; font-size: 17px !important; margin: 6px 0 8px !important; }
    .post-music.muted-tap::after { content: '\1F50A'; font-size: 12px; margin-left: -2px; }

<script>
(function () {
    if (window.pxMusicInit) return;   // zuia kufanya kazi mara mbili
    window.pxMusicInit = true;

    var audio = new Audio();
    audio.preload = 'none';
    audio.loop = true;
    var current = null;        // kadi inayocheza sasa
    var wanted = null;         // kadi inayoonekana na inapaswa kucheza
    var ratios = new Map();    // kadi -> uonekano

    function setPlaying(el, on) {
        if (!el) return;
        el.classList.toggle('playing', !!on);
    }
    function stop() {
        try { audio.pause(); } catch (e) {}
        setPlaying(current, false);
        current = null;
    }
    function play(el) {
        if (!el || !el.dataset.src) return;
        if (current === el && !audio.paused) return;
        if (current && current !== el) setPlaying(current, false);
        if (audio.getAttribute('data-cur') !== el.dataset.src) {
            audio.src = el.dataset.src;
            audio.setAttribute('data-cur', el.dataset.src);
        }
        current = el;
        var pr = audio.play();
        if (pr && pr.then) {
            pr.then(function () { setPlaying(el, true); el.classList.remove('muted-tap'); })
              .catch(function () { setPlaying(el, false); el.classList.add('muted-tap'); /* kivinjari kimezuia — itaanza kwenye mguso wa kwanza */ });
        } else { setPlaying(el, true); }
    }

    // Mguso wowote wa kwanza ukifungua autoplay, kisha cheza kadi inayoonekana
    function unlock() {
        if (wanted && !wanted._userPaused) play(wanted);
    }
    ['touchend', 'click', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, unlock, { passive: true });
    });

    // Mtumiaji akibonyeza kadi: pause / play kwa mkono
    window.pxToggleMusic = function (el) {
        if (current === el && !audio.paused) { el._userPaused = true; stop(); return; }
        el._userPaused = false; play(el);
    };

    // Chagua kadi inayoonekana zaidi
    function pick() {
        var best = null, br = 0;
        ratios.forEach(function (r, el) { if (r >= 0.6 && r > br && !el.dataset.noauto && document.body.contains(el)) { best = el; br = r; } });
        wanted = best;
        if (!best) { if (current) stop(); return; }
        if (best !== current && !best._userPaused) play(best);
    }

    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { ratios.set(en.target, en.intersectionRatio); });
            pick();
        }, { threshold: [0, 0.25, 0.6, 0.9] });
        function watch() {
            document.querySelectorAll('.post-music').forEach(function (n) {
                if (!n._pxw) { n._pxw = true; io.observe(n); }
            });
            ratios.forEach(function (r, el) { if (!document.body.contains(el)) { ratios.delete(el); io.unobserve(el); } });
        }
        document.addEventListener('DOMContentLoaded', watch);
        watch();
        setInterval(watch, 1500); // posts mpya za infinite scroll
    }

    // Zima muziki tab ikifichwa au unapofungua picha/video kubwa
    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
    document.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('.image-container, .feed-video-card, [onclick*="openVideoDetail"], [onclick*="openImageFullscreen"]')) stop();
    }, true);
})();
</script>
